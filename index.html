    ex: `Вертикальный (структурный) анализ показывает, из чего состоит итог: например, какую долю валюты баланса занимают основные средства или запасы. Горизонтальный анализ изучает динамику, трендовый — долгосрочную тенденцию, факторный — причины изменений.`,
    why: [`Это горизонтальный анализ.`, `Это факторный анализ.`, `Верно: вертикальный анализ — анализ структуры.`, `Это трендовый анализ.`],
    trick: `Вертикально — сверху вниз по отчёту (доли), горизонтально — слева направо по годам (динамика).`, mistake: `Путать вертикальный и горизонтальный анализ.`, takeaway: `Структура показывает то, чего не видно в абсолютных суммах.` },
  en: { q: `What does vertical analysis of financial statements study?`,
    o: [`Changes in items over several periods`, `The influence of factors on a result`, `Structure — each item’s share of the total`, `The development trend over 5–10 years`],
    ex: `Vertical (structural) analysis shows what a total is made of: for example, what share of total assets fixed assets or inventory represent. Horizontal analysis studies change over time, trend analysis the long-term direction, factor analysis the causes.`,
    why: [`That is horizontal analysis.`, `That is factor analysis.`, `Correct: vertical analysis is structural analysis.`, `That is trend analysis.`],
    trick: `Vertical — top to bottom through a statement (shares); horizontal — left to right across years (change).`, mistake: `Mixing up vertical and horizontal analysis.`, takeaway: `Structure reveals what absolute amounts hide.` } },
{ id: `met-3`, module: `methods`, diff: `medium`, type: `concept`, correct: 3,
  ru: { q: `В мультипликативной модели «Выпуск = Численность × Выработка» в каком порядке заменяют факторы способом цепных подстановок?`,
    o: [`Сначала выработку, затем численность`, `Порядок не имеет значения — результат одинаков`, `Одновременно оба фактора`, `Сначала численность (количественный фактор), затем выработку (качественный)`],
    ex: `Правило цепных подстановок: сначала заменяют количественные (объёмные) факторы, затем качественные. Порядок влияет на распределение совместного влияния факторов, поэтому его фиксируют, чтобы расчёты были сопоставимы.`,
    why: [`Нарушен порядок: качественный фактор заменяется последним.`, `Порядок влияет на величину влияния каждого фактора.`, `Одновременная замена даёт только общее отклонение.`, `Верно: количественный → качественный.`],
    trick: `«Сначала сколько, потом как».`, mistake: `Менять порядок подстановки от задачи к задаче.`, takeaway: `Единое правило порядка делает факторный анализ воспроизводимым.` },
  en: { q: `In the multiplicative model “Output = Headcount × Output per worker”, in what order are factors substituted using chain substitution?`,
    o: [`Productivity first, then headcount`, `Order does not matter — the result is the same`, `Both factors at once`, `Headcount (quantitative factor) first, then productivity (qualitative)`],
    ex: `The rule of chain substitution: quantitative (volume) factors first, qualitative ones after. The order affects how the joint effect is split between factors, so it is fixed to keep calculations comparable.`,
    why: [`The order is broken: the qualitative factor goes last.`, `Order does change each factor’s measured effect.`, `Substituting both at once yields only the total change.`, `Correct: quantitative → qualitative.`],
    trick: `“First how much, then how well.”`, mistake: `Changing the substitution order from one problem to the next.`, takeaway: `A single ordering rule makes factor analysis reproducible.` } },
{ id: `met-4`, module: `methods`, diff: `medium`, type: `calc`, correct: 0,
  ru: { q: `Товарооборот = Численность × Выработка. База: 50 чел × 40 млн сум; отчёт: 55 чел × 42 млн сум. Каково влияние изменения выработки (способ цепных подстановок)?`,
    ctx: { head: [`Показатель`, `База`, `Отчёт`], rows: [[`Численность, чел`, `50`, `55`], [`Выработка, млн сум`, `40`, `42`], [`Товарооборот, млн сум`, `2 000`, `2 310`]] },
    o: [`+110 млн сум`, `+100 млн сум`, `+200 млн сум`, `+310 млн сум`],
    ex: `Подстановка 1 (численность): 55 × 40 = 2 200; влияние численности 2 200 − 2 000 = +200. Подстановка 2 (выработка): 55 × 42 = 2 310; влияние выработки 2 310 − 2 200 = +110. Проверка: 200 + 110 = 310.`,
    why: [`Верно: 55 × (42 − 40) = +110.`, `Выработка умножена на базисную численность 50 — нарушен порядок подстановки.`, `+200 — влияние численности.`, `+310 — общее отклонение.`],
    trick: `Качественный фактор умножают на отчётное значение количественного.`, mistake: `Использовать базисную численность при расчёте влияния выработки.`, takeaway: `Сумма влияний всегда равна общему отклонению — это ваша проверка.` },
  en: { q: `Sales = Headcount × Output per worker. Base: 50 people × 40 m soums; actual: 55 × 42. What is the effect of the change in productivity (chain substitution)?`,
    ctx: { head: [`Item`, `Base`, `Actual`], rows: [[`Headcount`, `50`, `55`], [`Output per worker, m soums`, `40`, `42`], [`Sales, m soums`, `2,000`, `2,310`]] },
    o: [`+110 m soums`, `+100 m soums`, `+200 m soums`, `+310 m soums`],
    ex: `Step 1 (headcount): 55 × 40 = 2,200; effect of headcount 2,200 − 2,000 = +200. Step 2 (productivity): 55 × 42 = 2,310; effect of productivity 2,310 − 2,200 = +110. Check: 200 + 110 = 310.`,
    why: [`Correct: 55 × (42 − 40) = +110.`, `Productivity multiplied by base headcount 50 — the order is broken.`, `+200 is the effect of headcount.`, `+310 is the total change.`],
    trick: `The qualitative factor is multiplied by the actual value of the quantitative one.`, mistake: `Using base headcount when measuring the productivity effect.`, takeaway: `Factor effects always add up to the total change — that is your check.` } },
{ id: `met-5`, module: `methods`, diff: `hard`, type: `incorrect`, correct: 2,
  ru: { q: `Найдите НЕВЕРНОЕ утверждение о детерминированном факторном анализе.`,
    o: [`Сумма влияний всех факторов равна общему отклонению результативного показателя`, `Способ абсолютных разниц применяется к мультипликативным и смешанным моделям`, `Результат способа цепных подстановок не зависит от порядка замены факторов`, `Индексный метод позволяет разложить изменение выручки на влияние объёма и цен`],
    ex: `Порядок подстановки влияет на то, какому фактору достанется совместное влияние (произведение приращений). Именно поэтому порядок фиксируют, а для устранения неоднозначности используют интегральный метод.`,
    why: [`Утверждение верно — это балансовая проверка расчётов.`, `Утверждение верно.`, `Это и есть неверное утверждение: порядок влияет на результат.`, `Утверждение верно: Iв = Iq × Ip.`],
    trick: `Совместное влияние «прилипает» к фактору, который подставляют последним.`, mistake: `Считать цепные подстановки «нейтральными» к порядку.`, takeaway: `Порядок — часть метода; интегральный способ делит совместное влияние объективно.` },
  en: { q: `Find the INCORRECT statement about deterministic factor analysis.`,
    o: [`The effects of all factors add up to the total change in the result`, `The absolute-differences method applies to multiplicative and mixed models`, `The result of chain substitution does not depend on the order of substitution`, `The index method splits a change in revenue into volume and price effects`],
    ex: `The order of substitution determines which factor receives the joint effect (the product of the changes). That is why the order is fixed, and the integral method is used to remove the ambiguity.`,
    why: [`True — it is the balance check of the calculation.`, `True.`, `This is the incorrect statement: order does affect the result.`, `True: I_revenue = I_volume × I_price.`],
    trick: `The joint effect “sticks” to the factor substituted last.`, mistake: `Thinking chain substitution is neutral to order.`, takeaway: `Order is part of the method; the integral method splits the joint effect objectively.` } },
{ id: `met-6`, module: `methods`, diff: `expert`, type: `case`, correct: 1,
  ru: { q: `Два аналитика разложили одно и то же отклонение выпуска по модели «Численность × Выработка», но в разном порядке подстановки, и получили разное влияние факторов. Чей результат следует принять?`,
    o: [`Оба результата неверны: в правильном расчёте влияние факторов не зависит от порядка`, `Арифметически верны оба; методически принят порядок «количественный → качественный», а для устранения неоднозначности применяют интегральный метод`, `Верен расчёт, где влияние выработки больше — качественные факторы важнее`, `Нужно взять среднее арифметическое двух расчётов, и тогда сумма влияний не сойдётся`],
    ex: `Разница возникает из-за совместного влияния ΔЧ × ΔВ: оно достаётся фактору, подставленному последним. Оба аналитика посчитали правильно, но для сопоставимости используют общепринятый порядок (сначала количественные факторы). Интегральный метод делит совместное влияние между факторами поровну для двухфакторной модели, и результат не зависит от порядка.`,
    why: [`Расхождение — свойство метода, а не ошибка счёта.`, `Верно: правило порядка и интегральный метод решают проблему.`, `Важность фактора не определяется величиной его влияния в одном расчёте.`, `Среднее двух расчётов как раз даёт сходящуюся сумму — это и есть интегральный результат для двух факторов.`],
    trick: `Спорный «кусок» ΔЧ × ΔВ — причина всех разногласий.`, mistake: `Искать арифметическую ошибку там, где различие методическое.`, takeaway: `Знайте ограничения метода: это отличает аналитика от калькулятора.` },
  en: { q: `Two analysts split the same output change using “Headcount × Productivity” but in a different substitution order, and got different factor effects. Whose result should be accepted?`,
    o: [`Both are wrong: in a correct calculation the factor effects do not depend on order`, `Both are arithmetically correct; the accepted order is “quantitative → qualitative”, and the integral method removes the ambiguity`, `The one where productivity has the larger effect — qualitative factors matter more`, `Take the average of the two, and then the effects will no longer add up`],
    ex: `The difference comes from the joint effect ΔH × ΔP: it goes to the factor substituted last. Both analysts calculated correctly, but for comparability the accepted order is used (quantitative factors first). The integral method splits the joint effect equally in a two-factor model, so the result does not depend on order.`,
    why: [`The discrepancy is a property of the method, not an arithmetic error.`, `Correct: the ordering rule and the integral method solve the problem.`, `A factor’s importance is not shown by its effect in a single calculation.`, `The average of the two does add up — it is exactly the integral result for two factors.`],
    trick: `The disputed piece ΔH × ΔP causes every disagreement.`, mistake: `Hunting for an arithmetic error where the difference is methodological.`, takeaway: `Know the limits of a method — that separates an analyst from a calculator.` } },

/* ── 3 · Информационная система и баланс ─────────────────────────────────── */
{ id: `inf-1`, module: `info`, diff: `easy`, type: `concept`, correct: 0,
  ru: { q: `Какое равенство лежит в основе бухгалтерского баланса?`,
    o: [`Актив = Собственный капитал + Обязательства`, `Актив = Выручка − Расходы`, `Собственный капитал = Актив + Обязательства`, `Оборотные активы = Внеоборотные активы`],
    ex: `Актив показывает, во что вложены средства, пассив — откуда они получены: от собственников (собственный капитал) или от кредиторов (обязательства). Итоги равны всегда, потому что это два взгляда на одни и те же ресурсы.`,
    why: [`Верно: это основное балансовое уравнение.`, `Выручка и расходы — показатели отчёта о финансовых результатах.`, `Обязательства не прибавляются к активу, а являются его источником.`, `Равенство этих групп активов ничем не обусловлено.`],
    trick: `Актив — «что есть», пассив — «чьё это».`, mistake: `Путать баланс с отчётом о прибылях.`, takeaway: `Каждый сум имущества имеет источник — собственный или заёмный.` },
  en: { q: `Which equation underlies the balance sheet?`,
    o: [`Assets = Equity + Liabilities`, `Assets = Revenue − Expenses`, `Equity = Assets + Liabilities`, `Current assets = Non-current assets`],
    ex: `Assets show where funds are invested; equity and liabilities show where they came from: owners (equity) or creditors (liabilities). The totals always match because they are two views of the same resources.`,
    why: [`Correct: the basic accounting equation.`, `Revenue and expenses belong to the income statement.`, `Liabilities are not added to assets; they are a source of them.`, `Nothing requires these two asset groups to be equal.`],
    trick: `Assets — “what we have”; equity & liabilities — “whose it is”.`, mistake: `Confusing the balance sheet with the income statement.`, takeaway: `Every soum of assets has a source — own or borrowed.` } },
{ id: `inf-2`, module: `info`, diff: `easy`, type: `match`, correct: 2,
  ru: { q: `Какая из статей относится к текущим (оборотным) активам?`,
    o: [`Здание цеха`, `Патент на изобретение`, `Дебиторская задолженность покупателей`, `Долгосрочный банковский кредит`],
    ex: `Оборотные активы обращаются в течение одного операционного цикла или года: запасы, дебиторская задолженность, денежные средства, краткосрочные вложения. Здание и патент — долгосрочные активы, а кредит — вообще не актив, а обязательство (пассив).`,
    why: [`Здание — основное средство, долгосрочный актив.`, `Патент — нематериальный актив, долгосрочный.`, `Верно: дебиторская задолженность погашается в пределах цикла.`, `Кредит — источник средств, статья пассива.`],
    trick: `Оборотный актив «вернётся деньгами» в течение года.`, mistake: `Относить кредиты к активам, потому что они «приносят деньги».`, takeaway: `Различайте по сроку: до года — текущие, дольше — долгосрочные.` },
  en: { q: `Which item is a current asset?`,
    o: [`The workshop building`, `A patent`, `Trade receivables`, `A long-term bank loan`],
    ex: `Current assets turn over within one operating cycle or year: inventory, receivables, cash, short-term investments. The building and patent are non-current assets, and the loan is not an asset at all but a liability.`,
    why: [`A building is a fixed (non-current) asset.`, `A patent is a non-current intangible asset.`, `Correct: receivables are collected within the cycle.`, `A loan is a source of funds — a liability.`],
    trick: `A current asset “comes back as cash” within a year.`, mistake: `Calling loans assets because they “bring money in”.`, takeaway: `Classify by term: within a year — current; longer — non-current.` } },
{ id: `inf-3`, module: `info`, diff: `medium`, type: `calc`, correct: 0,
  ru: { q: `Доля основных средств в валюте баланса снизилась с 60% до 50%. Как правильно описать изменение структуры?`,
    o: [`Снижение на 10 процентных пунктов`, `Снижение на 16,7%`, `Снижение на 10%`, `Рост, так как сумма основных средств увеличилась`],
    ex: `Изменение доли измеряют в процентных пунктах: 50% − 60% = −10 п.п. Относительное изменение самой доли (−16,7%) тоже можно посчитать, но для структурного анализа его не используют — оно вводит в заблуждение.`,
    why: [`Верно: разность долей — в процентных пунктах.`, `Это относительное изменение доли (10 / 60), а не изменение структуры.`, `«Проценты» вместо «процентных пунктов» — терминологическая ошибка.`, `Сумма может расти, но доля при этом падать — структура о другом.`],
    trick: `Разность процентов — пункты, отношение процентов — проценты.`, mistake: `Говорить «доля снизилась на 10%», когда она снизилась на 10 п.п.`, takeaway: `Структурные сдвиги измеряют в процентных пунктах.` },
  en: { q: `The share of fixed assets in total assets fell from 60% to 50%. How should the structural change be described?`,
    o: [`A decrease of 10 percentage points`, `A decrease of 16.7%`, `A decrease of 10%`, `An increase, since fixed assets grew in amount`],
    ex: `A change in share is measured in percentage points: 50% − 60% = −10 p.p. The relative change in the share itself (−16.7%) can be calculated, but structural analysis does not use it — it misleads.`,
    why: [`Correct: the difference between shares is in percentage points.`, `That is the relative change in the share (10 / 60), not the structural change.`, `“Per cent” instead of “percentage points” is a terminology error.`, `The amount can rise while the share falls — structure is a different question.`],
    trick: `A difference of percentages gives points; a ratio of percentages gives per cent.`, mistake: `Saying “the share fell 10%” when it fell 10 p.p.`, takeaway: `Structural shifts are measured in percentage points.` } },
{ id: `inf-4`, module: `info`, diff: `medium`, type: `concept`, correct: 1,
  ru: { q: `Что означает требование сопоставимости аналитической информации?`,
    o: [`Информация должна поступать не реже раза в месяц`, `Сравниваемые показатели должны быть рассчитаны по единой методике, в одной оценке и за сопоставимые периоды`, `Данные должны совпадать с показателями конкурентов`, `Все показатели должны быть выражены в натуральных единицах`],
    ex: `Сравнивать можно только сопоставимое: если в одном году запасы оценены по одной методике, а в другом — по иной, или изменились цены, состав предприятия, длительность периода, то отклонение покажет разницу методик, а не реальное изменение.`,
    why: [`Это требование своевременности, а не сопоставимости.`, `Верно: единая методика, оценка, период и состав.`, `Совпадение с конкурентами не требуется — с ними сравнивают.`, `Стоимостные показатели вполне допустимы.`],
    trick: `«Сравнивай яблоки с яблоками».`, mistake: `Сравнивать показатели до и после смены учётной политики без пересчёта.`, takeaway: `Перед сравнением приведите данные к единой базе.` },
  en: { q: `What does the requirement of comparability of information mean?`,
    o: [`Information must arrive at least monthly`, `Compared indicators must use the same method, the same valuation and comparable periods`, `Data must match competitors’ figures`, `All indicators must be expressed in physical units`],
    ex: `Only like can be compared with like: if inventory is valued one way in one year and differently in the next, or prices, company scope or period length change, the difference reflects methods, not real change.`,
    why: [`That is timeliness, not comparability.`, `Correct: same method, valuation, period and scope.`, `Matching competitors is not required — they are a benchmark.`, `Value indicators are perfectly acceptable.`],
    trick: `“Compare apples with apples.”`, mistake: `Comparing figures before and after an accounting-policy change without restating.`, takeaway: `Bring data to a common basis before comparing.` } },
{ id: `inf-5`, module: `info`, diff: `hard`, type: `case`, correct: 3,
  ru: { q: `Сравнительный аналитический баланс показал четыре изменения за год. Какое из них — тревожный сигнал?`,
    o: [`Валюта баланса выросла на 12%`, `Оборотные активы росли быстрее внеоборотных`, `Доля собственного капитала составила 55%`, `Дебиторская задолженность выросла в три раза быстрее кредиторской`],
    ex: `Первые три изменения соответствуют признакам «хорошего» баланса. Опережающий рост дебиторской задолженности означает, что предприятие всё больше кредитует покупателей, а само получает отсрочку меньше: деньги отвлекаются из оборота, растёт риск неплатежей и кассовых разрывов.`,
    why: [`Рост валюты баланса обычно говорит о расширении деятельности.`, `Опережающий рост оборотных активов повышает мобильность имущества.`, `Собственный капитал выше 50% — признак независимости.`, `Верно: дисбаланс расчётов отвлекает деньги и повышает риск.`],
    trick: `Дебиторка — деньги, которые у вас «взяли взаймы» покупатели.`, mistake: `Считать любой рост статей актива положительным.`, takeaway: `Темпы роста дебиторской и кредиторской задолженности должны быть сопоставимы.` },
  en: { q: `A comparative analytical balance sheet shows four changes over the year. Which one is a warning sign?`,
    o: [`Total assets grew 12%`, `Current assets grew faster than non-current assets`, `Equity reached 55% of total assets`, `Receivables grew three times faster than payables`],
    ex: `The first three changes match the signs of a “healthy” balance sheet. Receivables outpacing payables means the company increasingly finances its customers while getting less credit itself: cash is diverted from circulation, and the risk of non-payment and cash gaps rises.`,
    why: [`Growth in total assets usually reflects expanding activity.`, `Faster growth of current assets makes the asset base more liquid.`, `Equity above 50% signals independence.`, `Correct: the imbalance in settlements ties up cash and raises risk.`],
    trick: `Receivables are money your customers have “borrowed” from you.`, mistake: `Treating any growth in assets as positive.`, takeaway: `Receivables and payables should grow at comparable rates.` } },
{ id: `inf-6`, module: `info`, diff: `expert`, type: `concept`, correct: 2,
  ru: { q: `Какой вывод можно обоснованно сделать, имея только бухгалтерский баланс на две даты?`,
    o: [`Какова прибыль по каждому виду продукции за год`, `Каковы денежные потоки по видам деятельности за год`, `Как изменились состав и структура имущества и источников его финансирования`, `Какова себестоимость единицы продукции`],
    ex: `Баланс — моментный отчёт: он фиксирует состояние имущества и источников на дату. Сравнение двух дат показывает изменения состава и структуры. Доходы и расходы за период отражает отчёт о финансовых результатах, движение денег — отчёт о денежных потоках, себестоимость изделий — данные управленческого учёта.`,
    why: [`Прибыль по видам продукции — данные управленческого учёта.`, `Потоки по видам деятельности раскрывает отчёт о денежных потоках.`, `Верно: это ровно то, что показывает сравнение двух балансов.`, `Себестоимость единицы в балансе не раскрывается.`],
    trick: `Баланс — фотография, отчёт о результатах — видео.`, mistake: `Требовать от баланса ответов о результатах периода.`, takeaway: `Каждая форма отчётности отвечает на свой вопрос — анализ их объединяет.` },
  en: { q: `What conclusion can be reliably drawn from balance sheets at two dates alone?`,
    o: [`Profit by product for the year`, `Cash flows by activity for the year`, `How the composition and structure of assets and their funding sources changed`, `Unit cost of production`],
    ex: `A balance sheet is a point-in-time statement of assets and their sources. Comparing two dates reveals changes in composition and structure. Income and expenses for the period are in the income statement, cash movement in the cash flow statement, product costs in management accounts.`,
    why: [`Profit by product comes from management accounts.`, `Flows by activity are shown in the cash flow statement.`, `Correct: this is exactly what comparing two balance sheets shows.`, `Unit cost does not appear in the balance sheet.`],
    trick: `A balance sheet is a photo; the income statement is a video.`, mistake: `Expecting the balance sheet to explain the period’s results.`, takeaway: `Each statement answers its own question — analysis brings them together.` } },

/* ── 4 · Экономический потенциал ─────────────────────────────────────────── */
{ id: `pot-1`, module: `potential`, diff: `easy`, type: `match`, correct: 3,
  ru: { q: `Что относится к трудовой составляющей экономического потенциала?`,
    o: [`Парк станков и оборудования`, `Патенты и ноу-хау`, `Собственный капитал`, `Численность и квалификация персонала`],
    ex: `Трудовой потенциал — это люди: их число, квалификация, опыт и время, которое они могут отработать. Станки относятся к производственной составляющей, патенты — к инновационной, капитал — к финансовой.`,
    why: [`Станки — производственный потенциал.`, `Патенты и ноу-хау — инновационный (интеллектуальный) потенциал.`, `Капитал — финансовый потенциал.`, `Верно: персонал — трудовой потенциал.`],
    trick: `Каждая составляющая — ответ на вопрос «чем?»: машинами, людьми, деньгами, знаниями.`, mistake: `Относить знания, закреплённые в патентах, к трудовому потенциалу.`, takeaway: `Потенциал многомерен — оценивайте каждую составляющую.` },
  en: { q: `Which belongs to the labour component of economic potential?`,
    o: [`The fleet of machines and equipment`, `Patents and know-how`, `Equity capital`, `Number and skills of staff`],
    ex: `Labour potential is people: their number, skills, experience and available working time. Machines belong to production potential, patents to innovation potential, capital to financial potential.`,
    why: [`Machines are production potential.`, `Patents and know-how are innovation (intellectual) potential.`, `Capital is financial potential.`, `Correct: staff are labour potential.`],
    trick: `Each component answers “with what?”: machines, people, money, knowledge.`, mistake: `Placing knowledge protected by patents under labour potential.`, takeaway: `Potential has many dimensions — assess each one.` } },
{ id: `pot-2`, module: `potential`, diff: `easy`, type: `calc`, correct: 1,
  ru: { q: `Производственная мощность — 20 000 изделий в год, фактический выпуск — 15 000. Каков коэффициент использования мощности?`,
    o: [`1,33`, `0,75`, `0,25`, `5 000 изделий`],
    ex: `Kм = 15 000 / 20 000 = 0,75 — мощность используется на 75%. Резерв роста выпуска — 5 000 изделий без новых вложений.`,
    why: [`Мощность разделена на выпуск — перевёрнутое отношение.`, `Верно: 15 000 / 20 000 = 0,75.`, `0,25 — доля неиспользованной мощности.`, `5 000 — резерв в натуральном выражении, а не коэффициент.`],
    trick: `Факт в числителе, возможность — в знаменателе.`, mistake: `Делить мощность на выпуск.`, takeaway: `Коэффициент ниже 1 — сигнал искать резервы внутри.` },
  en: { q: `Production capacity is 20,000 units a year; actual output is 15,000. What is the capacity utilisation ratio?`,
    o: [`1.33`, `0.75`, `0.25`, `5,000 units`],
    ex: `Ku = 15,000 / 20,000 = 0.75 — capacity is 75% used. The reserve is 5,000 more units without new investment.`,
    why: [`Capacity divided by output — the ratio is inverted.`, `Correct: 15,000 / 20,000 = 0.75.`, `0.25 is the unused share of capacity.`, `5,000 is the reserve in units, not the ratio.`],
    trick: `Actual on top, possible underneath.`, mistake: `Dividing capacity by output.`, takeaway: `A ratio below 1 says: look for reserves inside.` } },
{ id: `pot-3`, module: `potential`, diff: `medium`, type: `compare`, correct: 0,
  ru: { q: `Какое из решений соответствует интенсивному пути использования потенциала?`,
    o: [`Рост выработки на действующем оборудовании за счёт сокращения простоев`, `Покупка дополнительной производственной линии`, `Найм второй смены рабочих`, `Аренда нового складского помещения`],
    ex: `Интенсивный путь — получить больше результата от тех же ресурсов. Сокращение простоев повышает отдачу существующего оборудования без новых затрат. Остальные варианты увеличивают количество ресурсов — это экстенсивный путь.`,
    why: [`Верно: больше выпуска от тех же ресурсов.`, `Новая линия — дополнительный ресурс (экстенсивно).`, `Новые работники — дополнительный ресурс.`, `Новое помещение — дополнительный ресурс.`],
    trick: `Интенсивно — «выжать больше из того, что есть».`, mistake: `Считать любое увеличение выпуска интенсивным.`, takeaway: `Критерий — источник роста: количество или качество использования ресурсов.` },
  en: { q: `Which decision follows the intensive path of using potential?`,
    o: [`Raising output on existing equipment by cutting downtime`, `Buying an additional production line`, `Hiring a second shift`, `Renting a new warehouse`],
    ex: `The intensive path gets more results from the same resources. Cutting downtime raises the return on existing equipment without new spending. The other options add resources — the extensive path.`,
    why: [`Correct: more output from the same resources.`, `A new line is an additional resource (extensive).`, `New workers are an additional resource.`, `A new warehouse is an additional resource.`],
    trick: `Intensive — “get more out of what you already have”.`, mistake: `Calling any growth in output intensive.`, takeaway: `The criterion is the source of growth: quantity or quality of resource use.` } },
{ id: `pot-4`, module: `potential`, diff: `medium`, type: `calc`, correct: 2,
  ru: { q: `Коэффициент экстенсивной загрузки оборудования — 0,9, интенсивной — 0,8. Чему равен интегральный коэффициент загрузки?`,
    o: [`1,70`, `0,85`, `0,72`, `0,10`],
    ex: `Интегральная загрузка = Kэкст × Kинт = 0,9 × 0,8 = 0,72. Оборудование работает 90% возможного времени и в это время даёт 80% возможной производительности — в итоге используется 72% потенциала.`,
    why: [`Коэффициенты не складываются.`, `0,85 — среднее арифметическое, а показатели перемножаются.`, `Верно: 0,9 × 0,8 = 0,72.`, `0,1 — разность, лишённая экономического смысла.`],
    trick: `Время × скорость = результат, поэтому коэффициенты перемножают.`, mistake: `Усреднять коэффициенты загрузки.`, takeaway: `Потери времени и потери производительности накладываются друг на друга.` },
  en: { q: `Extensive equipment loading is 0.9 and intensive loading is 0.8. What is the integral loading ratio?`,
    o: [`1.70`, `0.85`, `0.72`, `0.10`],
    ex: `Integral loading = Kext × Kint = 0.9 × 0.8 = 0.72. Equipment runs 90% of the available time and during that time achieves 80% of possible productivity — 72% of potential is used overall.`,
    why: [`The ratios are not added.`, `0.85 is the arithmetic mean; the ratios multiply.`, `Correct: 0.9 × 0.8 = 0.72.`, `0.1 is a difference with no economic meaning.`],
    trick: `Time × speed = result, so the ratios multiply.`, mistake: `Averaging loading ratios.`, takeaway: `Time losses and productivity losses compound each other.` } },
{ id: `pot-5`, module: `potential`, diff: `hard`, type: `case`, correct: 1,
  ru: { q: `Руководство хочет купить второй станок, потому что «не хватает мощностей». Анализ показал: коэффициент использования мощности 0,65, основная причина — простои из-за несвоевременной поставки сырья. Какой вывод обоснован?`,
    o: [`Покупка оправдана: мощность действительно ограничивает выпуск`, `Сначала нужно устранить простои: внутренний резерв составляет около трети мощности, и новый станок будет простаивать по той же причине`, `Следует сократить план выпуска до фактического уровня`, `Нужно купить два станка, чтобы компенсировать простои`],
    ex: `Узкое место — не оборудование, а снабжение. Пока поставки сырья не наладятся, новый станок также будет простаивать, а вложения не окупятся. Резерв (35% мощности) можно реализовать организационными мерами — интенсивно и почти без затрат.`,
    why: [`Мощность используется на 65% — она не является ограничением.`, `Верно: сначала устраните причину простоев.`, `Сокращение плана закрепляет потери, а не устраняет их.`, `Дополнительные станки умножат простои.`],
    trick: `Найдите узкое место прежде, чем расширять всё остальное.`, mistake: `Решать организационную проблему капитальными вложениями.`, takeaway: `Инвестиции в мощность оправданы, только когда она используется почти полностью.` },
  en: { q: `Management wants to buy a second machine because “capacity is short”. Analysis shows capacity utilisation is 0.65, mainly due to downtime from late raw-material deliveries. Which conclusion is justified?`,
    o: [`The purchase is justified: capacity really limits output`, `Fix the downtime first: the internal reserve is about a third of capacity, and a new machine would stand idle for the same reason`, `Cut the output plan to the actual level`, `Buy two machines to compensate for downtime`],
    ex: `The bottleneck is supply, not equipment. Until deliveries are fixed, a new machine would also stand idle and never pay back. The reserve (35% of capacity) can be unlocked by organisational measures — intensively and almost at no cost.`,
    why: [`Capacity is only 65% used — it is not the constraint.`, `Correct: remove the cause of downtime first.`, `Cutting the plan locks in the losses instead of removing them.`, `More machines would multiply the downtime.`],
    trick: `Find the bottleneck before expanding everything else.`, mistake: `Solving an organisational problem with capital spending.`, takeaway: `Investing in capacity makes sense only when it is almost fully used.` } },
{ id: `pot-6`, module: `potential`, diff: `expert`, type: `compare`, correct: 3,
  ru: { q: `Предприятие А: основные средства 10 млрд сум, использование мощности 60%. Предприятие Б: основные средства 7 млрд сум, использование мощности 95%. Какая оценка их экономического потенциала наиболее обоснована?`,
    o: [`Потенциал А выше и используется лучше, так как его имущество дороже`, `Потенциалы равны, поскольку оба предприятия работают в одной отрасли`, `Б следует срочно расширять мощности — 95% означает перегрузку и низкую эффективность`, `У А больше ресурсный потенциал, но Б реализует свой эффективнее; у А крупный резерв роста без вложений, у Б рост возможен в основном за счёт новых мощностей`],
    ex: `Ресурсный потенциал (что есть) и его реализация (что получается) — разные вещи. А располагает большими ресурсами, но 40% мощности простаивает — это внутренний резерв. Б почти исчерпал возможности: дальнейший рост потребует экстенсивных вложений. Высокая загрузка Б — признак эффективности, а не проблемы, хотя и сигнал о скором пределе.`,
    why: [`Стоимость имущества не говорит о его использовании.`, `Отраслевая принадлежность не уравнивает потенциалы.`, `95% — признак эффективности; расширение — вопрос будущего роста, а не «срочная» мера.`, `Верно: различайте величину потенциала и степень его реализации.`],
    trick: `Большой склад инструментов ≠ хорошая работа.`, mistake: `Оценивать потенциал по стоимости активов.`, takeaway: `Анализ потенциала отвечает на два вопроса: сколько ресурсов и насколько хорошо они работают.` },
  en: { q: `Company A: fixed assets 10 bn soums, capacity utilisation 60%. Company B: fixed assets 7 bn soums, utilisation 95%. Which assessment of their economic potential is best supported?`,
    o: [`A has greater potential and uses it better, since its assets are worth more`, `Their potential is equal because both operate in the same industry`, `B must urgently expand — 95% means overload and low efficiency`, `A has more resource potential, but B realises its potential better; A has a large reserve without investment, while B can grow mostly through new capacity`],
    ex: `Resource potential (what you have) and its realisation (what you get) are different things. A has more resources, but 40% of its capacity is idle — an internal reserve. B has nearly exhausted its capacity: further growth will require extensive investment. B’s high utilisation signals efficiency, not a problem — though also an approaching limit.`,
    why: [`Asset value says nothing about how assets are used.`, `Being in the same industry does not equalise potential.`, `95% signals efficiency; expansion is a question of future growth, not an emergency.`, `Correct: distinguish the size of potential from how fully it is realised.`],
    trick: `A big toolbox ≠ good work.`, mistake: `Judging potential by the value of assets.`, takeaway: `Analysing potential answers two questions: how many resources, and how well they work.` } },

/* ── 5 · Основные средства ───────────────────────────────────────────────── */
{ id: `fix-1`, module: `fixed`, diff: `easy`, type: `concept`, correct: 2,
  ru: { q: `Как рассчитывается фондоотдача?`,
    o: [`Среднегодовая стоимость ОС / Выручка`, `Стоимость ОС / Численность работников`, `Выручка / Среднегодовая стоимость ОС`, `Прибыль / Выручка`],
    ex: `Фондоотдача показывает, сколько выручки (продукции) приносит один сум основных средств. Обратный показатель — фондоёмкость, отношение ОС к численности — фондовооружённость, прибыль к выручке — рентабельность продаж.`,
    why: [`Это фондоёмкость.`, `Это фондовооружённость.`, `Верно: выручка на сум основных средств.`, `Это рентабельность продаж.`],
    trick: `«Отдача» — что получили (выручка) делим на то, что вложили (фонды).`, mistake: `Путать фондоотдачу с фондоёмкостью.`, takeaway: `Фондоотдача — ключевой показатель эффективности использования ОС.` },
  en: { q: `How is asset turnover (fondootdacha) calculated?`,
    o: [`Average fixed assets / Revenue`, `Fixed assets / Headcount`, `Revenue / Average fixed assets`, `Profit / Revenue`],
    ex: `Asset turnover shows how much revenue (output) each soum of fixed assets generates. The inverse is capital intensity; fixed assets per worker is capital per worker; profit over revenue is return on sales.`,
    why: [`That is capital intensity.`, `That is capital per worker.`, `Correct: revenue per soum of fixed assets.`, `That is return on sales.`],
    trick: `“Return” — what you got (revenue) over what you put in (assets).`, mistake: `Confusing asset turnover with capital intensity.`, takeaway: `Asset turnover is the key measure of how well fixed assets are used.` } },
{ id: `fix-2`, module: `fixed`, diff: `easy`, type: `match`, correct: 0,
  ru: { q: `Что относится к активной части основных средств?`,
    o: [`Рабочие машины и оборудование`, `Здание заводоуправления`, `Ограждение территории`, `Складское помещение`],
    ex: `Активная часть непосредственно воздействует на предмет труда: станки, машины, оборудование, транспорт. Здания и сооружения — пассивная часть, они создают условия для работы.`,
    why: [`Верно: оборудование напрямую участвует в производстве.`, `Здание — пассивная часть.`, `Сооружение — пассивная часть.`, `Склад — пассивная часть.`],
    trick: `Активная часть «двигается и работает», пассивная «стоит и защищает».`, mistake: `Считать дорогие здания активной частью из-за их стоимости.`, takeaway: `Рост доли активной части обычно повышает фондоотдачу.` },
  en: { q: `What belongs to the active part of fixed assets?`,
    o: [`Working machines and equipment`, `The head-office building`, `Perimeter fencing`, `A warehouse`],
    ex: `The active part acts directly on the materials: machine tools, machinery, equipment, vehicles. Buildings and structures are the passive part — they provide working conditions.`,
    why: [`Correct: equipment takes part in production directly.`, `A building is the passive part.`, `A structure is the passive part.`, `A warehouse is the passive part.`],
    trick: `The active part “moves and works”; the passive part “stands and shelters”.`, mistake: `Calling expensive buildings active because of their value.`, takeaway: `A higher share of the active part usually raises asset turnover.` } },
{ id: `fix-3`, module: `fixed`, diff: `medium`, type: `calc`, correct: 0,
  ru: { q: `ОС на начало года — 4 000, поступило — 600, выбыло — 200, на конец года — 4 400 млн сум. Каков коэффициент обновления?`,
    o: [`13,6%`, `15,0%`, `5,0%`, `10,0%`],
    ex: `Kобн = Поступившие / ОС на конец года = 600 / 4 400 = 13,6%. База — конец года, потому что новые объекты входят в состав ОС к концу периода.`,
    why: [`Верно: 600 / 4 400.`, `Поступившие разделены на стоимость на начало года.`, `5% — коэффициент выбытия (200 / 4 000).`, `10% — коэффициент прироста ((600 − 200) / 4 000).`],
    trick: `«Новое — к концу, старое — к началу».`, mistake: `Использовать для обновления стоимость ОС на начало года.`, takeaway: `Обновление считают к концу года, выбытие — к началу.` },
  en: { q: `Opening fixed assets 4,000, added 600, retired 200, closing 4,400 m soums. What is the renewal ratio?`,
    o: [`13.6%`, `15.0%`, `5.0%`, `10.0%`],
    ex: `Kren = Additions / Closing fixed assets = 600 / 4,400 = 13.6%. The base is the closing value, because new items are part of the asset base by the end of the period.`,
    why: [`Correct: 600 / 4,400.`, `Additions were divided by the opening value.`, `5% is the retirement ratio (200 / 4,000).`, `10% is the growth ratio ((600 − 200) / 4,000).`],
    trick: `“New against the end, old against the start.”`, mistake: `Using the opening value for the renewal ratio.`, takeaway: `Renewal is measured against the closing value, retirement against the opening value.` } },
{ id: `fix-4`, module: `fixed`, diff: `medium`, type: `cause`, correct: 1,
  ru: { q: `Фондоотдача предприятия выросла. Что произошло с фондоёмкостью?`,
    o: [`Выросла в той же пропорции`, `Снизилась, так как это обратный показатель`, `Не изменилась — показатели независимы`, `Изменение невозможно определить без данных о прибыли`],
    ex: `Фондоёмкость = 1 / Фондоотдача. Если на каждый сум ОС приходится больше продукции, то на каждый сум продукции нужно меньше основных средств.`,
    why: [`Показатели обратны, а не прямо пропорциональны.`, `Верно: ФЕ = 1 / ФО.`, `Показатели жёстко связаны.`, `Прибыль в расчёт обоих показателей не входит.`],
    trick: `Отдача и ёмкость — две стороны одной дроби.`, mistake: `Думать, что рост обоих показателей одновременно возможен.`, takeaway: `Снижение фондоёмкости — то же, что рост фондоотдачи.` },
  en: { q: `A company’s asset turnover increased. What happened to capital intensity?`,
    o: [`It rose in the same proportion`, `It fell, because it is the inverse`, `It stayed the same — the indicators are independent`, `It cannot be determined without profit data`],
    ex: `Capital intensity = 1 / Asset turnover. If each soum of assets yields more output, each soum of output needs fewer assets.`,
    why: [`The indicators are inverse, not proportional.`, `Correct: CI = 1 / AT.`, `They are rigidly linked.`, `Profit is not part of either indicator.`],
    trick: `Turnover and intensity are two sides of one fraction.`, mistake: `Thinking both can rise together.`, takeaway: `Lower capital intensity means the same as higher asset turnover.` } },
{ id: `fix-5`, module: `fixed`, diff: `hard`, type: `calc`, correct: 0,
  ru: { q: `Выработка = Фондоотдача × Фондовооружённость. Фондовооружённость выросла на 20%, а выработка не изменилась. Как изменилась фондоотдача?`,
    o: [`Снизилась примерно на 16,7%`, `Выросла на 20%`, `Не изменилась`, `Снизилась на 20%`],
    ex: `Iвыр = Iфо × Iфв → 1,0 = Iфо × 1,2 → Iфо = 1 / 1,2 = 0,833. Фондоотдача снизилась на 16,7%: новая техника пока не даёт прироста производительности.`,
    why: [`Верно: 1 / 1,2 = 0,833.`, `Знак противоположный: при неизменной выработке рост ФВ снижает ФО.`, `Если бы ФО не изменилась, выработка выросла бы на 20%.`, `Индексы делят, а не вычитают: 1 / 1,2 ≠ 0,8.`],
    trick: `В мультипликативной модели индексы перемножаются, а не складываются.`, mistake: `Вычитать проценты вместо деления индексов.`, takeaway: `Рост оснащённости оправдан, только если растёт производительность.` },
  en: { q: `Output per worker = Asset turnover × Capital per worker. Capital per worker rose 20% while output per worker did not change. How did asset turnover change?`,
    o: [`It fell by about 16.7%`, `It rose 20%`, `It did not change`, `It fell 20%`],
    ex: `I_output = I_AT × I_CW → 1.0 = I_AT × 1.2 → I_AT = 1 / 1.2 = 0.833. Asset turnover fell 16.7%: the new equipment is not yet raising productivity.`,
    why: [`Correct: 1 / 1.2 = 0.833.`, `Wrong direction: with flat output, more capital per worker lowers turnover.`, `If turnover were unchanged, output would have risen 20%.`, `Indices divide, not subtract: 1 / 1.2 ≠ 0.8.`],
    trick: `In a multiplicative model, indices multiply rather than add.`, mistake: `Subtracting percentages instead of dividing indices.`, takeaway: `More equipment per worker pays only if productivity rises.` } },
{ id: `fix-6`, module: `fixed`, diff: `expert`, type: `case`, correct: 2,
  ru: { q: `Коэффициент износа ОС — 0,70, обновления — 2%, выбытия — 1%. Какая оценка состояния основных средств наиболее обоснована?`,
    o: [`Состояние хорошее: выбытие ниже обновления, значит, парк растёт`, `Состояние удовлетворительное: износ 70% — норма для любой отрасли`, `Парк сильно изношен и почти не обновляется: при таких темпах износ будет расти, увеличатся простои и затраты на ремонт — нужна программа обновления`, `Состояние нельзя оценить без данных о выручке`],
    ex: `Износ 70% означает, что большая часть стоимости уже перенесена на продукцию. При обновлении 2% в год парк обновится полностью лишь за 50 лет — быстрее он стареет. Формальное превышение обновления над выбытием почти ничего не меняет: изношенные объекты продолжают работать.`,
    why: [`Превышение на 1 п.п. не компенсирует высокий износ.`, `Универсальной «нормы» износа нет; 70% — высокий уровень.`, `Верно: высокий износ при вялом обновлении — риск для производства.`, `Состояние фондов оценивается по коэффициентам износа и движения без выручки.`],
    trick: `Срок полного обновления ≈ 1 / Kобн: 1 / 0,02 = 50 лет.`, mistake: `Считать ситуацию благополучной, раз обновление выше выбытия.`, takeaway: `Оценивайте состояние и движение фондов вместе.` },
  en: { q: `The wear ratio of fixed assets is 0.70, renewal 2%, retirement 1%. Which assessment of their condition is best supported?`,
    o: [`Good: retirement is below renewal, so the fleet is growing`, `Satisfactory: 70% wear is normal in any industry`, `The fleet is heavily worn and barely renewed: wear will keep rising, with more downtime and repair costs — a renewal programme is needed`, `Condition cannot be assessed without revenue data`],
    ex: `70% wear means most of the value has already been transferred to output. At 2% renewal a year, the fleet would take about 50 years to renew fully — it ages faster than that. Renewal formally exceeding retirement changes little: worn assets keep working.`,
    why: [`A 1 p.p. excess does not offset high wear.`, `There is no universal “norm”; 70% is high.`, `Correct: heavy wear with sluggish renewal threatens production.`, `Condition is assessed by wear and movement ratios without revenue.`],
    trick: `Full renewal period ≈ 1 / Kren: 1 / 0.02 = 50 years.`, mistake: `Thinking all is well because renewal exceeds retirement.`, takeaway: `Assess condition and movement of assets together.` } },

/* ── 6 · Нематериальные активы ───────────────────────────────────────────── */
{ id: `int-1`, module: `intangible`, diff: `easy`, type: `match`, correct: 1,
  ru: { q: `Что НЕ может быть признано нематериальным активом?`,
    o: [`Патент на изобретение`, `Высокая квалификация сотрудников`, `Зарегистрированный товарный знак`, `Купленная программа для ЭВМ`],
    ex: `НМА должен быть идентифицируем и контролироваться предприятием. Знания сотрудников принадлежат им самим: работник может уволиться, и предприятие не может ими распоряжаться. Поэтому квалификация — важный ресурс, но не актив баланса.`,
    why: [`Патент — классический НМА.`, `Верно: квалификацию нельзя отделить и контролировать.`, `Товарный знак — НМА.`, `Программа для ЭВМ — НМА.`],
    trick: `НМА можно продать отдельно от людей.`, mistake: `Относить к НМА всё ценное и неосязаемое.`, takeaway: `Признак НМА — контроль и отделимость, а не только ценность.` },
  en: { q: `What CANNOT be recognised as an intangible asset?`,
    o: [`A patent`, `Highly skilled employees`, `A registered trademark`, `Purchased software`],
    ex: `An intangible asset must be identifiable and controlled by the company. Employees’ knowledge belongs to them: they can leave, and the company cannot dispose of it. So skills are a valuable resource, but not a balance-sheet asset.`,
    why: [`A patent is a classic intangible.`, `Correct: skills cannot be separated or controlled.`, `A trademark is an intangible.`, `Software is an intangible.`],
    trick: `An intangible can be sold separately from people.`, mistake: `Treating anything valuable and invisible as an intangible.`, takeaway: `The test is control and separability, not just value.` } },
{ id: `int-2`, module: `intangible`, diff: `easy`, type: `calc`, correct: 3,
  ru: { q: `Лицензия куплена за 90 млн сум на 6 лет. Какова годовая сумма линейной амортизации?`,
    o: [`90 млн сум`, `6 млн сум`, `11,1 млн сум`, `15 млн сум`],
    ex: `A = 90 / 6 = 15 млн сум в год. Стоимость лицензии равномерно переносится на расходы в течение срока её действия.`,
    why: [`Это первоначальная стоимость.`, `6 — срок, а не сумма.`, `Неверное деление (100 / 9).`, `Верно: 90 / 6 = 15.`],
    trick: `Линейно — «поровну на каждый год».`, mistake: `Путать срок использования и сумму амортизации.`, takeaway: `Линейная амортизация = стоимость / срок.` },
  en: { q: `A licence was bought for 90 m soums for 6 years. What is the annual straight-line amortisation?`,
    o: [`90 m soums`, `6 m soums`, `11.1 m soums`, `15 m soums`],
    ex: `A = 90 / 6 = 15 m soums a year. The cost is spread evenly over the licence term.`,
    why: [`That is the original cost.`, `6 is the term, not an amount.`, `A wrong division (100 / 9).`, `Correct: 90 / 6 = 15.`],
    trick: `Straight-line — “an equal share each year”.`, mistake: `Confusing the term with the amortisation amount.`, takeaway: `Straight-line amortisation = cost / term.` } },
{ id: `int-3`, module: `intangible`, diff: `medium`, type: `calc`, correct: 0,
  ru: { q: `НМА стоимостью 200 млн сум амортизируется линейно 5 лет. Прошло 3 года. Каковы коэффициент износа и остаточная стоимость?`,
    o: [`60%; 80 млн сум`, `40%; 120 млн сум`, `60%; 120 млн сум`, `30%; 140 млн сум`],
    ex: `Годовая амортизация 200 / 5 = 40; за 3 года — 120. Kизн = 120 / 200 = 60%. Остаточная стоимость = 200 − 120 = 80 млн сум.`,
    why: [`Верно: износ 60%, остаток 80.`, `Перепутаны износ и годность.`, `Остаточная стоимость перепутана с накопленной амортизацией.`, `Ошибка в расчёте годовой амортизации.`],
    trick: `Износ + годность = 100%.`, mistake: `Путать накопленную амортизацию и остаточную стоимость.`, takeaway: `Остаточная стоимость = первоначальная − накопленная амортизация.` },
  en: { q: `An intangible costing 200 m soums is amortised straight-line over 5 years. Three years have passed. What are the wear ratio and carrying amount?`,
    o: [`60%; 80 m soums`, `40%; 120 m soums`, `60%; 120 m soums`, `30%; 140 m soums`],
    ex: `Annual amortisation 200 / 5 = 40; over 3 years — 120. Wear = 120 / 200 = 60%. Carrying amount = 200 − 120 = 80 m soums.`,
    why: [`Correct: wear 60%, carrying amount 80.`, `Wear and serviceability are swapped.`, `Carrying amount confused with accumulated amortisation.`, `An error in the annual amortisation.`],
    trick: `Wear + serviceability = 100%.`, mistake: `Confusing accumulated amortisation with the carrying amount.`, takeaway: `Carrying amount = cost − accumulated amortisation.` } },
{ id: `int-4`, module: `intangible`, diff: `medium`, type: `concept`, correct: 2,
  ru: { q: `Когда в учёте появляется деловая репутация (гудвилл)?`,
    o: [`Когда компания создаёт сильный бренд собственными силами`, `Ежегодно по результатам оценки независимым экспертом`, `При покупке бизнеса — как разница между ценой покупки и справедливой стоимостью его чистых активов`, `При регистрации товарного знака`],
    ex: `Гудвилл возникает только при приобретении бизнеса: покупатель платит больше стоимости отдельных активов за клиентскую базу, репутацию, команду. Внутренне созданная репутация не признаётся — её нельзя надёжно измерить.`,
    why: [`Внутренне созданная репутация не признаётся активом.`, `Оценка эксперта сама по себе не создаёт гудвилл в учёте.`, `Верно: гудвилл — «переплата» при покупке бизнеса.`, `Товарный знак — отдельный НМА.`],
    trick: `Гудвилл можно только купить, но не вырастить в учёте.`, mistake: `Считать любой известный бренд гудвиллом в балансе.`, takeaway: `Гудвилл измерим лишь в момент сделки.` },
  en: { q: `When does goodwill appear in the accounts?`,
    o: [`When a company builds a strong brand on its own`, `Every year after an independent valuation`, `When a business is acquired — as the excess of the price over the fair value of its net assets`, `When a trademark is registered`],
    ex: `Goodwill arises only on acquisition: the buyer pays more than the value of individual assets for the customer base, reputation, team. Internally generated reputation is not recognised — it cannot be measured reliably.`,
    why: [`Internally generated reputation is not recognised as an asset.`, `A valuation alone does not create goodwill in the accounts.`, `Correct: goodwill is the “premium” paid for a business.`, `A trademark is a separate intangible.`],
    trick: `Goodwill can be bought, not grown, in the accounts.`, mistake: `Thinking any famous brand is goodwill on the balance sheet.`, takeaway: `Goodwill is measurable only at the moment of a deal.` } },
{ id: `int-5`, module: `intangible`, diff: `hard`, type: `calc`, correct: 0,
  ru: { q: `Выручка за год — 4 800 млн сум. Стоимость НМА на начало года — 380, на конец — 420 млн сум. Какова отдача нематериальных активов?`,
    o: [`12,0`, `12,6`, `11,4`, `0,083`],
    ex: `Среднегодовая стоимость НМА = (380 + 420) / 2 = 400. Отдача = 4 800 / 400 = 12 сум выручки на сум НМА.`,
    why: [`Верно: 4 800 / 400.`, `Взята стоимость на начало года (4 800 / 380).`, `Взята стоимость на конец года (4 800 / 420).`, `Это обратный показатель — ёмкость НМА.`],
    trick: `В знаменателе всегда среднее за период.`, mistake: `Использовать остаток на дату вместо среднего.`, takeaway: `Показатели отдачи рассчитывают по среднегодовой стоимости.` },
  en: { q: `Annual revenue is 4,800 m soums. Intangibles were 380 at the start and 420 m soums at the end. What is the return on intangibles?`,
    o: [`12.0`, `12.6`, `11.4`, `0.083`],
    ex: `Average intangibles = (380 + 420) / 2 = 400. Return = 4,800 / 400 = 12 soums of revenue per soum of intangibles.`,
    why: [`Correct: 4,800 / 400.`, `The opening value was used (4,800 / 380).`, `The closing value was used (4,800 / 420).`, `That is the inverse — intangible intensity.`],
    trick: `The denominator is always the period average.`, mistake: `Using a point-in-time balance instead of the average.`, takeaway: `Return indicators use average annual values.` } },
{ id: `int-6`, module: `intangible`, diff: `expert`, type: `case`, correct: 1,
  ru: { q: `За два года доля НМА в активах выросла с 3% до 9%, а отдача НМА снизилась с 25 до 11. Как оценить эту тенденцию?`,
    o: [`Однозначно положительно: рост доли НМА — признак инновационного развития`, `Рост доли НМА говорит об инновационности, но падение отдачи требует проверить, начали ли новые НМА приносить доход и не переплачено ли за них`, `Отрицательно: НМА всегда снижают эффективность компании`, `Тенденцию нельзя оценить: отдача НМА — второстепенный показатель`],
    ex: `Структура показывает направление (больше нематериальных вложений), отдача — результат. Снижение отдачи более чем вдвое может объясняться периодом внедрения (новые программы и патенты ещё не дали эффекта), но может говорить и о неудачных или переоценённых приобретениях. Вывод требует анализа динамики в следующие периоды.`,
    why: [`Доля без отдачи — половина картины.`, `Верно: рост вложений нужно подтверждать ростом дохода.`, `НМА могут резко повысить эффективность — вопрос в качестве вложений.`, `Отдача — главный критерий оправданности вложений в НМА.`],
    trick: `Структура — куда вложили, отдача — что получили.`, mistake: `Считать рост доли инновационных активов успехом без анализа отдачи.`, takeaway: `Инвестиции в НМА оцениваются по доходу, который они создают.` },
  en: { q: `Over two years, intangibles grew from 3% to 9% of assets while the return on intangibles fell from 25 to 11. How should the trend be assessed?`,
    o: [`Clearly positive: a larger share of intangibles signals innovation`, `A larger share suggests innovation, but the falling return calls for checking whether the new intangibles generate income and whether they were overpriced`, `Negative: intangibles always reduce efficiency`, `It cannot be assessed: return on intangibles is a minor indicator`],
    ex: `Structure shows the direction (more intangible investment); return shows the result. A fall of more than half may reflect a ramp-up period (new software and patents have not yet paid off), but it may also signal poor or overpriced acquisitions. The verdict requires watching the next periods.`,
    why: [`Share without return is half the picture.`, `Correct: rising investment must be confirmed by rising income.`, `Intangibles can greatly boost efficiency — the issue is investment quality.`, `Return is the main test of whether intangible investment is justified.`],
    trick: `Structure — where you invested; return — what you got.`, mistake: `Celebrating a larger share of innovative assets without checking their return.`, takeaway: `Investment in intangibles is judged by the income it creates.` } },

/* ── 7 · Оборотный капитал ───────────────────────────────────────────────── */
{ id: `wc-1`, module: `working`, diff: `easy`, type: `match`, correct: 3,
  ru: { q: `Что НЕ относится к оборотным активам?`,
    o: [`Запасы сырья`, `Готовая продукция на складе`, `Денежные средства на счёте`, `Производственное оборудование`],
    ex: `Оборотные активы полностью совершают оборот за один цикл: сырьё превращается в продукцию, продукция — в дебиторскую задолженность и деньги. Оборудование служит годами и относится к внеоборотным активам (основным средствам).`,
    why: [`Запасы — оборотный актив.`, `Готовая продукция — оборотный актив.`, `Денежные средства — оборотный актив.`, `Верно: оборудование — основное средство.`],
    trick: `Оборотный актив целиком «уходит» в продукт или деньги за один цикл.`, mistake: `Относить дорогие инструменты длительного пользования к оборотным активам.`, takeaway: `Критерий — срок обращения, а не стоимость.` },
  en: { q: `What is NOT a current asset?`,
    o: [`Raw-material inventory`, `Finished goods in the warehouse`, `Cash in the bank`, `Production equipment`],
    ex: `Current assets complete a full turn within one cycle: materials become products, products become receivables and cash. Equipment serves for years and is a non-current (fixed) asset.`,
    why: [`Inventory is a current asset.`, `Finished goods are a current asset.`, `Cash is a current asset.`, `Correct: equipment is a fixed asset.`],
    trick: `A current asset is fully “used up” into product or cash within one cycle.`, mistake: `Classing long-lived tools as current assets.`, takeaway: `The criterion is the turnover period, not the cost.` } },
{ id: `wc-2`, module: `working`, diff: `easy`, type: `calc`, correct: 1,
  ru: { q: `Выручка за год — 7 200 млн сум, средний остаток оборотных активов — 1 800 млн сум. Чему равны коэффициент оборачиваемости и длительность оборота (год = 360 дней)?`,
    o: [`0,25 оборота; 1 440 дней`, `4 оборота; 90 дней`, `4 оборота; 25 дней`, `5 400 оборотов; 0,07 дня`],
    ex: `Kоб = 7 200 / 1 800 = 4 оборота в год. Длительность оборота T = 360 / 4 = 90 дней.`,
    why: [`Это коэффициент загрузки и его «длительность» — перевёрнутое отношение.`, `Верно: 4 оборота, 90 дней.`, `Длительность — 360 / 4, а не 100 / 4.`, `Вычитание вместо деления.`],
    trick: `Дни × обороты = 360.`, mistake: `Делить остаток на выручку и называть это оборачиваемостью.`, takeaway: `Больше оборотов — меньше дней — меньше денег нужно в обороте.` },
  en: { q: `Annual revenue is 7,200 m soums; average current assets are 1,800 m soums. What are the turnover ratio and days per turnover (year = 360 days)?`,
    o: [`0.25 turns; 1,440 days`, `4 turns; 90 days`, `4 turns; 25 days`, `5,400 turns; 0.07 days`],
    ex: `Kt = 7,200 / 1,800 = 4 turns a year. Days per turnover T = 360 / 4 = 90 days.`,
    why: [`That is the loading ratio and its “days” — the ratio is inverted.`, `Correct: 4 turns, 90 days.`, `Days are 360 / 4, not 100 / 4.`, `Subtraction instead of division.`],
    trick: `Days × turns = 360.`, mistake: `Dividing the balance by revenue and calling it turnover.`, takeaway: `More turns — fewer days — less money tied up.` } },
{ id: `wc-3`, module: `working`, diff: `medium`, type: `calc`, correct: 0,
  ru: { q: `Длительность оборота оборотных активов сократилась с 60 до 54 дней. Выручка отчётного года — 5 400 млн сум (год = 360 дней). Каков эффект?`,
    o: [`Высвобождено 90 млн сум`, `Дополнительно вовлечено 90 млн сум`, `Высвобождено 6 млн сум`, `Высвобождено 540 млн сум`],
    ex: `Однодневная выручка = 5 400 / 360 = 15 млн сум. ΔОА = (54 − 60) × 15 = −90 млн сум. Знак «минус» означает высвобождение: для той же выручки нужно на 90 млн сум меньше оборотных средств.`,
    why: [`Верно: (54 − 60) × 15 = −90 — высвобождение.`, `Знак истолкован неверно: ускорение оборота высвобождает средства.`, `6 — изменение в днях, а не в деньгах.`, `Изменение в днях умножено на десятую часть выручки вместо однодневной.`],
    trick: `Дни × однодневная выручка = деньги.`, mistake: `Путать высвобождение и вовлечение.`, takeaway: `Каждый сэкономленный день оборота освобождает однодневную выручку.` },
  en: { q: `Days per turnover of current assets fell from 60 to 54. Revenue for the year is 5,400 m soums (year = 360 days). What is the effect?`,
    o: [`90 m soums released`, `90 m soums additionally tied up`, `6 m soums released`, `540 m soums released`],
    ex: `Daily revenue = 5,400 / 360 = 15 m soums. ΔCA = (54 − 60) × 15 = −90 m soums. The minus means release: the same revenue needs 90 m soums less in current assets.`,
    why: [`Correct: (54 − 60) × 15 = −90 — a release.`, `The sign is misread: faster turnover releases funds.`, `6 is the change in days, not money.`, `Days were multiplied by a tenth of revenue instead of daily revenue.`],
    trick: `Days × daily revenue = money.`, mistake: `Confusing release with tie-up.`, takeaway: `Each day saved releases one day’s revenue.` } },
{ id: `wc-4`, module: `working`, diff: `medium`, type: `cause`, correct: 2,
  ru: { q: `Оборачиваемость оборотных активов замедлилась. Каково следствие при неизменной выручке?`,
    o: [`Высвобождаются денежные средства`, `Снижается потребность в оборотном капитале`, `Требуется вовлечь дополнительные средства в оборот`, `Растёт коэффициент оборачиваемости`],
    ex: `Замедление означает, что каждый оборот длится дольше: средства дольше «заморожены» в запасах и расчётах. Чтобы обслуживать ту же выручку, нужно больше оборотных активов — их придётся профинансировать.`,
