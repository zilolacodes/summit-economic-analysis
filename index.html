<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF5EF">
<meta name="color-scheme" content="light">
<meta name="description" content="Summit — офлайн-курс «Экономический анализ»: 15 тем, конспекты, бесконечный тренажёр, аналитика и сертификат.">
<title>Summit · Экономический анализ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='11' fill='%2330463E'/%3E%3Ccircle cx='27' cy='13' r='3.2' fill='%23D6B86E'/%3E%3Cpath d='M8 28.5l7.5-11 4.2 6 3.3-4.3 9 9.3' fill='none' stroke='%23F7F8F5' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   SANSUI ACADEMY · DESIGN SYSTEM
   --------------------------------------------------------------------------
   01 Tokens            08 Question card        15 Results dashboard
   02 Base & type       09 Answer options       16 Charts
   03 Scenery           10 Explanation panel    17 Certificate
   04 App shell         11 Progress & HUD       18 Splash & loader
   05 Buttons           12 Navigator            19 Responsive
   06 Badges & chips    13 Dialogs & sheets     20 Reduced motion
   07 Welcome screen    14 Toasts               21 Print
   ========================================================================== */

/* ── 01 · Tokens ─────────────────────────────────────────────────────────── */
:root {
  --bg: #EEF5EF;
  --paper: #F7F8F5;
  --cloud: #FBFBF8;
  --green: #6F9584;
  --accent: #9CB7A4;
  --dark: #486B5E;
  --forest: #30463E;
  --stone: #D7DDD5;
  --gold: #D6B86E;
  --text: #27312E;
  --muted: #68756E;

  /* Semantic extensions, derived from the palette */
  --gold-ink: #8C6F2C;
  --gold-soft: #F4ECD6;
  --mint: #E3EEE6;
  --mint-2: #D3E4D8;
  --rose: #A85A50;
  --rose-soft: #F6E8E4;
  --rose-line: #E5C3BB;
  --vermilion: #A9574A;
  --line: rgba(72, 107, 94, .14);
  --line-strong: rgba(72, 107, 94, .26);
  --glass: rgba(251, 251, 248, .78);
  --glass-strong: rgba(251, 251, 248, .92);

  --serif: "PT Serif", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px; --r-pill: 999px;

  --sh-1: 0 1px 1px rgba(48, 70, 62, .04), 0 2px 6px rgba(48, 70, 62, .05);
  --sh-2: 0 1px 2px rgba(48, 70, 62, .05), 0 10px 28px -10px rgba(48, 70, 62, .18);
  --sh-3: 0 2px 6px rgba(48, 70, 62, .05), 0 28px 70px -24px rgba(48, 70, 62, .30);
  --glow: 0 0 0 4px rgba(111, 149, 132, .16);

  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.36, .64, 1);
  --t-fast: 180ms; --t-med: 380ms; --t-slow: 700ms;

  --topbar-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

/* ── 02 · Base & typography ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  font: 400 16px/1.6 var(--sans); color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility; overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; color: var(--forest); margin: 0; letter-spacing: -.01em; line-height: 1.2; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { width: 16px; height: 16px; }
.icon--lg { width: 26px; height: 26px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font: 600 11.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--dark); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
::selection { background: rgba(214, 184, 110, .35); }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--dark); outline-offset: 3px;
  box-shadow: 0 0 0 6px rgba(214, 184, 110, .28);
  border-radius: inherit;
}

/* ── 03 · Scenery ────────────────────────────────────────────────────────── */
.scenery { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; contain: strict;
  background: linear-gradient(180deg, #E4EFE7 0%, #EEF5EF 38%, #F3F7F2 62%, #E9F1EB 100%); }
.scenery__sun { position: absolute; width: 70vmax; height: 70vmax; left: 58%; top: -30vmax; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 251, 236, .95) 0%, rgba(250, 244, 222, .45) 30%, rgba(250, 244, 222, 0) 62%); }
.scenery__layer { position: absolute; left: -4%; width: 108%; bottom: 0; will-change: transform; }
.scenery__layer svg { width: 100%; height: 100%; }
.layer-clouds { top: 8%; height: 46%; left: -10%; width: 120%; }
.layer-far { height: 72%; }
.layer-mid { height: 60%; }
.layer-near { height: 44%; }
.layer-lake { height: 26%; }
.layer-fore { height: 40%; }
.scenery__drift { animation: drift 160s linear infinite alternate; }
.scenery__drift--slow { animation-duration: 240s; animation-direction: alternate-reverse; }
@keyframes drift { from { transform: translate3d(-3%, 0, 0); } to { transform: translate3d(3%, 0, 0); } }

.fog { position: absolute; left: -30%; width: 160%; height: 26%; border-radius: 50%; will-change: transform;
  background: radial-gradient(ellipse at center, rgba(251, 251, 248, .85) 0%, rgba(251, 251, 248, .45) 40%, rgba(251, 251, 248, 0) 70%); }
.fog--1 { bottom: 26%; animation: fog 70s var(--ease-in-out) infinite alternate; }
.fog--2 { bottom: 8%; height: 22%; opacity: .9; animation: fog 95s var(--ease-in-out) infinite alternate-reverse; }
.fog--3 { bottom: 44%; height: 18%; opacity: .55; animation: fog 120s var(--ease-in-out) infinite alternate; }
@keyframes fog { from { transform: translate3d(-8%, 0, 0) scaleX(1); } to { transform: translate3d(8%, -2%, 0) scaleX(1.08); } }

.birds { position: absolute; top: 16%; left: 0; width: 260px; height: 90px; animation: birds-fly 110s linear infinite; will-change: transform; opacity: .55; }
.birds--2 { top: 26%; width: 160px; height: 60px; animation-duration: 150s; animation-delay: -60s; opacity: .4; }
.birds .bird { transform-box: fill-box; transform-origin: center; animation: flap 1.6s var(--ease-in-out) infinite alternate; }
.birds .bird:nth-child(2n) { animation-duration: 1.9s; animation-delay: -.6s; }
.birds .bird:nth-child(3n) { animation-duration: 2.2s; animation-delay: -1.1s; }
@keyframes birds-fly { from { transform: translate3d(110vw, 0, 0); } 50% { transform: translate3d(40vw, -24px, 0); } to { transform: translate3d(-300px, 8px, 0); } }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }

.particles { position: absolute; inset: 0; }
.particles i { position: absolute; bottom: -10px; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 252, 238, 1), rgba(214, 184, 110, .0) 70%);
  box-shadow: 0 0 6px rgba(255, 250, 230, .9); opacity: 0;
  animation: float-up var(--d, 22s) linear infinite; animation-delay: var(--dl, 0s); will-change: transform, opacity; }
@keyframes float-up {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  12% { opacity: .9; }
  80% { opacity: .55; }
  100% { transform: translate3d(var(--dx, 30px), -70vh, 0); opacity: 0; }
}
.lake-shimmer line { animation: shimmer 7s var(--ease-in-out) infinite alternate; }
.lake-shimmer line:nth-child(2n) { animation-duration: 9s; animation-delay: -3s; }
@keyframes shimmer { from { opacity: .15; transform: translateX(-12px); } to { opacity: .7; transform: translateX(12px); } }

.scenery__grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; background-size: 220px 220px; }
.scenery__veil { position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 42%, rgba(247, 248, 245, .55), rgba(247, 248, 245, 0) 70%); transition: opacity var(--t-slow) var(--ease-out); }
body[data-screen="quiz"] .scenery__veil, body[data-screen="results"] .scenery__veil { opacity: 1;
  background: radial-gradient(ellipse 80% 70% at 50% 40%, rgba(247, 248, 245, .7), rgba(247, 248, 245, .15) 75%); }

/* ── 04 · App shell ──────────────────────────────────────────────────────── */
.app { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: calc(var(--topbar-h) + var(--safe-t)); padding: var(--safe-t) clamp(16px, 3vw, 36px) 0;
  display: flex; align-items: center; gap: 18px; transition: background var(--t-med), box-shadow var(--t-med), backdrop-filter var(--t-med); }
.topbar.is-raised { background: rgba(247, 248, 245, .72); backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); box-shadow: 0 1px 0 var(--line); }
.brand { display: flex; align-items: center; gap: 12px; color: var(--forest); text-decoration: none; border-radius: 12px; }
.brand__seal { width: 36px; height: 36px; }
.brand__name { font: 400 19px/1 var(--serif); letter-spacing: .02em; }
.brand__sub { display: block; font: 600 10px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.topbar__center { flex: 1; min-width: 0; display: flex; justify-content: center; }
.topbar__title { font: 400 15px/1.2 var(--serif); color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(4px); transition: opacity var(--t-med), transform var(--t-med) var(--ease-out); }
body[data-screen="quiz"] .topbar__title, body[data-screen="results"] .topbar__title { opacity: 1; transform: none; }
.topbar__actions { display: flex; align-items: center; gap: 6px; }
.topbar__progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: transparent; overflow: hidden; opacity: 0; transition: opacity var(--t-med); }
body[data-screen="quiz"] .topbar__progress { opacity: 1; }
.topbar__progress span { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0));
  background: linear-gradient(90deg, var(--accent), var(--green) 60%, var(--gold)); transition: transform var(--t-slow) var(--ease-out); }

.view { flex: 1; position: relative; overflow-x: clip; }
.screen { width: 100%; max-width: 1240px; margin: 0 auto; padding: 18px clamp(16px, 3vw, 36px) calc(56px + var(--safe-b));
  animation: screen-in 720ms var(--ease-out) backwards; }
.screen.is-leaving { animation: screen-out 320ms var(--ease-in-out) both; }
@keyframes screen-in { from { opacity: 0; transform: translate3d(0, 14px, 0); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes screen-out { to { opacity: 0; transform: translate3d(0, -10px, 0); filter: blur(6px); } }

.card { position: relative; background: var(--glass); border: 1px solid rgba(255, 255, 255, .75); border-radius: var(--r-xl);
  box-shadow: var(--sh-2), inset 0 1px 0 rgba(255, 255, 255, .8);
  backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1); }
.card--pad { padding: clamp(20px, 3vw, 32px); }
.card__title { display: flex; align-items: center; gap: 10px; font: 400 21px/1.25 var(--serif); color: var(--forest); margin-bottom: 18px; }
.card__title .icon { color: var(--green); }
.card__hint { font-size: 13.5px; color: var(--muted); margin: -10px 0 18px; }
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); border: 0; margin: 22px 0; }

/* Segmented control (language) */
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: rgba(215, 221, 213, .55); border: 1px solid rgba(255, 255, 255, .6); position: relative; }
.seg button { position: relative; z-index: 1; min-width: 40px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); font: 600 12.5px/1 var(--sans); letter-spacing: .06em; color: var(--muted); transition: color var(--t-fast); }
.seg button[aria-pressed="true"] { color: var(--forest); }
.seg__thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: var(--r-pill); background: var(--cloud); box-shadow: var(--sh-1); transition: transform var(--t-med) var(--ease-spring), width var(--t-med) var(--ease-out); }
.seg--lg button { height: 40px; padding: 0 18px; font-size: 14px; letter-spacing: .01em; font-weight: 500; }

/* ── 05 · Buttons ────────────────────────────────────────────────────────── */
.btn { --bg: var(--glass-strong); --fg: var(--forest); --bd: var(--line-strong);
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 22px; border-radius: var(--r-pill);
  background: var(--bg); color: var(--fg); border: 1px solid var(--bd);
  font: 600 15px/1 var(--sans); letter-spacing: .01em; white-space: nowrap;
  box-shadow: var(--sh-1);
  transition: transform var(--t-med) var(--ease-out), box-shadow var(--t-med) var(--ease-out), background var(--t-fast), color var(--t-fast), border-color var(--t-fast), opacity var(--t-fast); }
.btn:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.btn:active { transform: translateY(0) scale(.98); transition-duration: 90ms; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn--primary { --bg: var(--forest); --fg: var(--cloud); --bd: var(--forest); box-shadow: 0 1px 2px rgba(48, 70, 62, .2), 0 12px 26px -12px rgba(48, 70, 62, .6); }
.btn--primary::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .16) 50%, transparent 70%); transform: translateX(-100%); transition: transform 900ms var(--ease-out); }
.btn--primary:hover { --bg: #283c35; box-shadow: 0 2px 4px rgba(48, 70, 62, .2), 0 18px 34px -14px rgba(48, 70, 62, .7), 0 0 0 5px rgba(156, 183, 164, .25); }
.btn--primary:hover::before { transform: translateX(100%); }
.btn--gold { --bg: linear-gradient(180deg, #E2C885, var(--gold)); --fg: #3B3018; --bd: #CDAE62; background: linear-gradient(180deg, #E4CB8A, #D3B467); }
.btn--ghost { --bg: transparent; --bd: transparent; box-shadow: none; color: var(--dark); }
.btn--ghost:hover { --bg: rgba(215, 221, 213, .45); box-shadow: none; }
.btn--lg { min-height: 56px; padding: 0 30px; font-size: 16px; }
.btn--sm { min-height: 38px; padding: 0 14px; font-size: 13.5px; gap: 8px; }
.btn--block { width: 100%; }
.btn .kbd { margin-left: 2px; }

.icon-btn { position: relative; overflow: hidden; width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--dark);
  transition: background var(--t-fast), color var(--t-fast), transform var(--t-med) var(--ease-out); }
.icon-btn:hover { background: rgba(215, 221, 213, .55); transform: translateY(-1px); }
.icon-btn:active { transform: scale(.94); }
.icon-btn[aria-pressed="true"] { color: var(--forest); background: rgba(156, 183, 164, .32); }
.icon-btn--bordered { border: 1px solid var(--line-strong); background: var(--glass-strong); }
.icon-btn .dot { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--cloud); }

/* Toggle chip (bookmark / review later) */
.chip-toggle { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: var(--r-pill);
  font: 600 12.5px/1 var(--sans); color: var(--muted); border: 1px solid var(--line); background: rgba(251, 251, 248, .6);
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast), transform var(--t-med) var(--ease-out); }
.chip-toggle:hover { color: var(--dark); border-color: var(--line-strong); transform: translateY(-1px); }
.chip-toggle[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold-soft); border-color: rgba(214, 184, 110, .6); }
.chip-toggle[aria-pressed="true"] .icon { fill: rgba(214, 184, 110, .55); animation: pop 420ms var(--ease-spring); }
.chip-toggle[data-kind="review"][aria-pressed="true"] { color: var(--dark); background: var(--mint); border-color: var(--accent); }
.chip-toggle[data-kind="review"][aria-pressed="true"] .icon { fill: rgba(156, 183, 164, .5); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font: 600 11px/1 var(--mono);
  color: var(--dark); background: var(--cloud); border: 1px solid var(--stone); box-shadow: 0 1px 0 var(--stone); }
.btn--primary .kbd { background: rgba(255, 255, 255, .12); color: var(--cloud); border-color: rgba(255, 255, 255, .2); box-shadow: none; }

/* Ripple */
.ripple { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; transform: scale(0); opacity: .5;
  background: radial-gradient(circle, rgba(156, 183, 164, .55) 0%, rgba(156, 183, 164, 0) 70%); animation: ripple 720ms var(--ease-out) forwards; }
.btn--primary .ripple { background: radial-gradient(circle, rgba(255, 255, 255, .35) 0%, rgba(255, 255, 255, 0) 70%); }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ── 06 · Badges & chips ─────────────────────────────────────────────────── */
.badge { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: var(--r-pill);
  font: 600 12px/1 var(--sans); letter-spacing: .02em; color: var(--dark); background: rgba(227, 238, 230, .85); border: 1px solid rgba(156, 183, 164, .45); white-space: nowrap; }
.badge .icon { width: 15px; height: 15px; }
.badge--plain { background: rgba(251, 251, 248, .7); border-color: var(--line); color: var(--muted); }
.badge--diff { gap: 8px; }
.diff-dots { display: inline-flex; gap: 3px; }
.diff-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--stone); }
.diff-dots i.on { background: currentColor; }
.badge--diff[data-diff="easy"] { color: #4E7A63; }
.badge--diff[data-diff="medium"] { color: var(--dark); }
.badge--diff[data-diff="hard"] { color: #7D6427; background: var(--gold-soft); border-color: rgba(214, 184, 110, .5); }
.badge--diff[data-diff="expert"] { color: #F3EBD3; background: var(--forest); border-color: var(--forest); }
.badge--diff[data-diff="expert"] .diff-dots i { background: rgba(255, 255, 255, .25); }
.badge--diff[data-diff="expert"] .diff-dots i.on { background: var(--gold); }

.meta-chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── 07 · Welcome ────────────────────────────────────────────────────────── */
.welcome { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); align-items: center; min-height: calc(100dvh - var(--topbar-h) - 80px); padding-top: 12px; }
.hero > * { animation: rise 900ms var(--ease-out) both; }
.hero > *:nth-child(2) { animation-delay: 90ms; } .hero > *:nth-child(3) { animation-delay: 180ms; }
.hero > *:nth-child(4) { animation-delay: 270ms; } .hero > *:nth-child(5) { animation-delay: 360ms; }
@keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.hero__eyebrow { display: inline-flex; align-items: center; gap: 12px; }
.hero__eyebrow::before { content: ""; width: 34px; height: 1px; background: var(--dark); opacity: .5; }
.hero__title { font-size: clamp(40px, 5.6vw, 72px); line-height: 1.02; margin: 18px 0 20px; color: var(--forest); letter-spacing: -.02em; }
.hero__title em { font-style: italic; color: var(--dark); }
.hero__lead { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.7; color: var(--muted); max-width: 34em; }
.hero__facts { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 10px 28px; margin-top: 32px; }
.fact { display: flex; flex-direction: column; gap: 6px; padding-left: 14px; border-left: 1px solid var(--line-strong); }
.fact b { font: 400 26px/1 var(--serif); color: var(--forest); }
.fact span { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.hero__seal { margin-top: 34px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
.hero__seal svg { width: 44px; height: 44px; }
.enso path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s var(--ease-out) .3s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.setup { padding: clamp(22px, 3vw, 34px); animation: rise 900ms var(--ease-out) 200ms both; }
.setup__section + .setup__section { margin-top: 26px; }
.setup__label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.setup__label h2 { font-size: 20px; }
.setup__label span { font-size: 12.5px; color: var(--muted); }

.field { position: relative; }
.field input { width: 100%; height: 58px; padding: 22px 18px 8px 50px; border-radius: var(--r-md); background: rgba(251, 251, 248, .9);
  border: 1px solid var(--stone); font-size: 16px; color: var(--text); transition: border-color var(--t-fast), box-shadow var(--t-med) var(--ease-out), background var(--t-fast); }
.field input:hover { border-color: var(--accent); }
.field input:focus { border-color: var(--green); box-shadow: var(--glow); background: var(--cloud); }
.field label { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--muted); pointer-events: none; transform-origin: left; transition: transform var(--t-med) var(--ease-out), color var(--t-fast); }
.field input:focus + label, .field input:not(:placeholder-shown) + label { transform: translateY(-118%) scale(.78); color: var(--dark); }
.field .icon { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--green); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { position: relative; overflow: hidden; text-align: left; padding: 18px 18px 16px; border-radius: var(--r-lg); background: rgba(251, 251, 248, .82);
  border: 1px solid var(--stone); box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: 10px;
  transition: transform var(--t-med) var(--ease-out), box-shadow var(--t-med) var(--ease-out), border-color var(--t-fast), background var(--t-fast); }
.mode:hover { transform: translateY(-3px); box-shadow: var(--sh-2); border-color: var(--accent); }
.mode__icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--dark); background: var(--mint); transition: background var(--t-med), color var(--t-med), transform var(--t-med) var(--ease-spring); }
.mode__title { font: 400 18px/1.2 var(--serif); color: var(--forest); }
.mode__desc { font-size: 13px; line-height: 1.5; color: var(--muted); }
.mode__check { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--stone); display: grid; place-items: center; color: var(--cloud); transition: all var(--t-med) var(--ease-spring); }
.mode__check .icon { width: 14px; height: 14px; stroke-width: 2.4; opacity: 0; transform: scale(.4); transition: all var(--t-med) var(--ease-spring); }
.mode[aria-checked="true"] { border-color: var(--green); background: var(--cloud); box-shadow: var(--sh-2), 0 0 0 4px rgba(156, 183, 164, .22); }
.mode[aria-checked="true"] .mode__icon { background: var(--forest); color: var(--gold); transform: rotate(-6deg) scale(1.04); }
.mode[aria-checked="true"] .mode__check { background: var(--green); border-color: var(--green); }
.mode[aria-checked="true"] .mode__check .icon { opacity: 1; transform: scale(1); }
.setup__start { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
.setup__note { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

.resume { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 22px; border-radius: var(--r-md); background: var(--gold-soft); border: 1px solid rgba(214, 184, 110, .5); animation: rise 700ms var(--ease-out) both; }
.resume__icon { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--cloud); color: var(--gold-ink); flex: none; }
.resume__text { flex: 1; font-size: 13.5px; line-height: 1.45; }
.resume__text b { display: block; font: 400 15.5px/1.3 var(--serif); color: var(--forest); }
.resume__actions { display: flex; gap: 6px; }

/* ── 08 · Question card ──────────────────────────────────────────────────── */
.quiz { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.q-card { padding: clamp(22px, 3.2vw, 40px); overflow: hidden; }
.q-timer { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(215, 221, 213, .6); }
.q-timer span { display: block; height: 100%; transform-origin: left; transform: scaleX(var(--p, 1)); background: linear-gradient(90deg, var(--green), var(--accent)); transition: transform 1s linear, background var(--t-med); }
.q-timer[data-state="warn"] span { background: linear-gradient(90deg, #C9A24E, var(--gold)); }
.q-timer[data-state="danger"] span { background: linear-gradient(90deg, var(--rose), #C98276); }
.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.q-head__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.q-head__tools { display: flex; gap: 8px; }
.q-num { display: inline-flex; align-items: baseline; gap: 6px; margin-right: 8px; font: 400 15px/1 var(--serif); color: var(--muted); }
.q-num b { font: 400 30px/1 var(--serif); color: var(--forest); letter-spacing: -.02em; }
.q-stage { margin-top: clamp(22px, 3vw, 34px); }
.q-stage.is-enter-next { animation: stage-next 560ms var(--ease-out) both; }
.q-stage.is-enter-prev { animation: stage-prev 560ms var(--ease-out) both; }
@keyframes stage-next { from { opacity: 0; transform: translate3d(28px, 0, 0); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes stage-prev { from { opacity: 0; transform: translate3d(-28px, 0, 0); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.q-type { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.q-type::before { content: ""; width: 18px; height: 1px; background: var(--gold); }
.q-text { font-size: clamp(21px, 2.3vw, 28px); line-height: 1.42; color: var(--text); max-width: 46em; letter-spacing: -.005em; }
.q-text:focus { outline: none; box-shadow: none; }

.q-ctx { margin-top: 22px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: rgba(251, 251, 248, .75); max-width: 720px; }
.q-ctx table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.q-ctx th { text-align: left; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 13px 16px; background: rgba(227, 238, 230, .6); }
.q-ctx td { padding: 11px 16px; border-top: 1px solid var(--line); }
.q-ctx td:not(:first-child), .q-ctx th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.q-ctx td:not(:first-child) { font-weight: 600; color: var(--forest); }
.q-ctx tr:last-child td { }
.q-ctx--signs td:not(:first-child), .q-ctx--signs th:not(:first-child) { text-align: center; font: 400 20px/1 var(--serif); }

/* ── 09 · Answer options ─────────────────────────────────────────────────── */
.options { display: grid; gap: 12px; margin-top: clamp(24px, 3vw, 32px); }
.option { position: relative; overflow: hidden; isolation: isolate; width: 100%; text-align: left;
  display: grid; grid-template-columns: 44px minmax(0, 1fr) 28px; align-items: center; gap: 16px;
  min-height: 68px; padding: 14px 18px 14px 14px; border-radius: 20px;
  background: rgba(251, 251, 248, .86); border: 1px solid var(--stone); box-shadow: var(--sh-1);
  font-size: 16px; line-height: 1.5; color: var(--text);
  transition: transform var(--t-med) var(--ease-out), box-shadow var(--t-med) var(--ease-out), border-color var(--t-fast), background var(--t-med), opacity var(--t-med); }
.option::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity var(--t-med); background: linear-gradient(100deg, rgba(227, 238, 230, .0), rgba(227, 238, 230, .9)); }
.option:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--sh-2), 0 0 0 4px rgba(156, 183, 164, .14); }
.option:hover::after { opacity: .7; }
.option:active { transform: translateY(0) scale(.995); }
.option__letter { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 400 19px/1 var(--serif); color: var(--dark); background: var(--mint); border: 1px solid rgba(156, 183, 164, .45);
  transition: background var(--t-med), color var(--t-med), transform var(--t-med) var(--ease-spring), border-color var(--t-med); }
.option__state { width: 28px; height: 28px; display: grid; place-items: center; }
.option__state svg { width: 26px; height: 26px; }
.option__state .draw { stroke-dasharray: 30; stroke-dashoffset: 30; }

.option.is-selected { border-color: var(--dark); background: var(--cloud); transform: scale(1.01); box-shadow: var(--sh-2), 0 0 0 4px rgba(72, 107, 94, .16); }
.option.is-selected .option__letter { background: var(--forest); color: var(--gold); border-color: var(--forest); transform: rotate(-4deg); }
.option.is-correct { border-color: var(--green); background: linear-gradient(100deg, #EAF3EC, #DCEBE0); box-shadow: var(--sh-2), 0 0 0 4px rgba(111, 149, 132, .2); animation: correct-pulse 900ms var(--ease-out); }
.option.is-correct .option__letter { background: var(--green); color: var(--cloud); border-color: var(--green); }
.option.is-correct .option__state { color: var(--dark); }
.option.is-correct .draw { animation: draw-check 520ms var(--ease-out) 120ms forwards; }
.option.is-wrong { border-color: var(--rose-line); background: var(--rose-soft); animation: shake 520ms var(--ease-out); }
.option.is-wrong .option__letter { background: #EED3CC; color: var(--rose); border-color: var(--rose-line); }
.option.is-wrong .option__state { color: var(--rose); }
.option.is-wrong .draw { animation: draw-check 420ms var(--ease-out) 80ms forwards; }
.option.is-dim { opacity: .58; }
.option.is-locked { cursor: default; }
.option.is-locked:hover { transform: none; box-shadow: var(--sh-1); border-color: var(--stone); }
.option.is-locked:hover::after { opacity: 0; }
.option.is-correct.is-locked:hover { border-color: var(--green); box-shadow: var(--sh-2), 0 0 0 4px rgba(111, 149, 132, .2); }
.option.is-wrong.is-locked:hover { border-color: var(--rose-line); }
.option.is-tried { opacity: .7; }
.option.is-tried .option__text { text-decoration: line-through; text-decoration-color: rgba(168, 90, 80, .45); }
@keyframes draw-check { to { stroke-dashoffset: 0; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 18% { transform: translateX(-7px); } 36% { transform: translateX(6px); } 54% { transform: translateX(-4px); } 72% { transform: translateX(2px); } }
@keyframes correct-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.015); } 100% { transform: scale(1); } }
.option__burst { position: absolute; left: 36px; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; border: 2px solid var(--green); z-index: 2; pointer-events: none; animation: burst 800ms var(--ease-out) forwards; }
@keyframes burst { from { transform: scale(1); opacity: .9; } to { transform: scale(14); opacity: 0; } }

.q-feedback { min-height: 0; margin-top: 16px; font-size: 14.5px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
.q-feedback:empty { display: none; }
.q-feedback .icon { margin-top: 2px; color: var(--green); }
.q-feedback.is-hint { padding: 14px 16px; border-radius: var(--r-md); background: var(--rose-soft); border: 1px solid var(--rose-line); color: #6E3F38; animation: rise 500ms var(--ease-out) both; }
.q-feedback.is-hint .icon { color: var(--rose); }
.q-feedback.is-saved { padding: 12px 16px; border-radius: var(--r-md); background: var(--mint); color: var(--dark); animation: rise 500ms var(--ease-out) both; }

.q-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: clamp(26px, 3vw, 36px); padding-top: 22px; border-top: 1px solid var(--line); }
.q-foot__mid { display: flex; gap: 6px; }

.xp-float { position: fixed; z-index: 60; pointer-events: none; font: 700 15px/1 var(--sans); color: var(--gold-ink); padding: 8px 12px; border-radius: var(--r-pill); background: var(--gold-soft); border: 1px solid rgba(214, 184, 110, .6); box-shadow: var(--sh-2);
  animation: xp-float 1500ms var(--ease-out) forwards; }
@keyframes xp-float { 0% { opacity: 0; transform: translate3d(-50%, 6px, 0) scale(.8); } 18% { opacity: 1; transform: translate3d(-50%, -8px, 0) scale(1.05); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate3d(-50%, -46px, 0) scale(1); } }

/* ── 10 · Explanation panel ──────────────────────────────────────────────── */
.explain { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 760ms var(--ease-out); }
.explain.is-open { grid-template-rows: 1fr; }
.explain__clip { overflow: hidden; min-height: 0; }
.explain__body { padding-top: 28px; opacity: 0; transform: translate3d(0, 14px, 0); transition: opacity 600ms var(--ease-out) 160ms, transform 700ms var(--ease-out) 160ms; }
.explain.is-open .explain__body { opacity: 1; transform: none; }
.verdict { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: var(--r-lg); background: linear-gradient(110deg, #E7F1EA, #F4F8F3); border: 1px solid rgba(156, 183, 164, .55); }
.verdict--wrong { background: linear-gradient(110deg, #F7EAE6, #FAF4F1); border-color: var(--rose-line); }
.verdict__icon { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--cloud); box-shadow: 0 0 0 6px rgba(111, 149, 132, .18); }
.verdict--wrong .verdict__icon { background: var(--rose); box-shadow: 0 0 0 6px rgba(168, 90, 80, .14); }
.verdict__icon svg { width: 26px; height: 26px; stroke-width: 2.2; }
.verdict__icon .draw { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw-check 600ms var(--ease-out) 380ms forwards; }
.verdict__title { font: 400 22px/1.2 var(--serif); color: var(--forest); }
.verdict--wrong .verdict__title { color: #6E3F38; }
.verdict__answer { margin-top: 4px; font-size: 14.5px; color: var(--muted); }
.verdict__answer b { color: var(--forest); font-weight: 600; }
.verdict > div:nth-child(2) { flex: 1 1 220px; min-width: 0; }
.verdict__xp { margin-left: auto; text-align: right; font: 700 14px/1.2 var(--sans); color: var(--gold-ink); white-space: nowrap; }
.verdict__xp small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); }

.ex-block { margin-top: 22px; }
.ex-block__head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ex-block__head .icon { color: var(--green); }
.ex-block__head h3 { font-size: 18px; }
.ex-block p { font-size: 16px; line-height: 1.75; color: var(--text); max-width: 48em; }
.takeaway { margin-top: 22px; padding: 18px 22px; border-radius: var(--r-md); background: linear-gradient(110deg, var(--gold-soft), rgba(251, 251, 248, .6)); border-left: 3px solid var(--gold); position: relative; }
.takeaway .eyebrow { color: var(--gold-ink); display: flex; align-items: center; gap: 8px; }
.takeaway p { margin-top: 8px; font: 400 17px/1.6 var(--serif); color: var(--forest); }

.accordion { margin-top: 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: rgba(251, 251, 248, .65); overflow: hidden; }
.accordion + .accordion { margin-top: 10px; }
.accordion__btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 18px; text-align: left; font: 400 17px/1.3 var(--serif); color: var(--forest); transition: background var(--t-fast); }
.accordion__btn:hover { background: rgba(227, 238, 230, .5); }
.accordion__btn .icon:first-child { color: var(--green); }
.accordion__chev { margin-left: auto; transition: transform var(--t-med) var(--ease-out); color: var(--muted); }
.accordion.is-open .accordion__chev { transform: rotate(180deg); }
.accordion__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 520ms var(--ease-out); }
.accordion.is-open .accordion__panel { grid-template-rows: 1fr; }
.accordion__clip { overflow: hidden; min-height: 0; }
.accordion__content { padding: 2px 18px 18px; opacity: 0; transition: opacity 380ms var(--ease-out); }
.accordion.is-open .accordion__content { opacity: 1; transition-delay: 120ms; }

.why-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.why-list li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 14px; border-radius: var(--r-sm); background: rgba(247, 248, 245, .9); border: 1px solid transparent; font-size: 14.5px; line-height: 1.6; }
.why-list li .letter { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font: 400 15px/1 var(--serif); background: #F1E4E0; color: var(--rose); }
.why-list li.is-right { background: #EAF3EC; border-color: rgba(156, 183, 164, .55); }
.why-list li.is-right .letter { background: var(--green); color: var(--cloud); }
.why-list li.is-picked:not(.is-right) { border-color: var(--rose-line); }
.why-list .picked-tag { display: inline-block; margin-left: 6px; font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--rose); }
.why-list li.is-right .picked-tag { color: var(--dark); }

.insights { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.insight { padding: 18px; border-radius: var(--r-md); background: rgba(251, 251, 248, .8); border: 1px solid var(--line); transition: transform var(--t-med) var(--ease-out), box-shadow var(--t-med) var(--ease-out); }
.insight:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.insight__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.insight__icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--mint); color: var(--dark); flex: none; }
.insight__icon .icon { width: 18px; height: 18px; }
.insight--trick .insight__icon { background: var(--gold-soft); color: var(--gold-ink); }
.insight--mistake .insight__icon { background: var(--rose-soft); color: var(--rose); }
.insight__title { font: 600 12px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.insight p { font-size: 14.5px; line-height: 1.65; }
.insight--trick p { font-family: var(--serif); font-size: 16px; color: var(--forest); }

/* ── 11 · Progress & HUD ─────────────────────────────────────────────────── */
.hud { position: sticky; top: calc(var(--topbar-h) + 16px); display: flex; flex-direction: column; gap: 16px; }
.hud__card { padding: 22px; }
.hud__top { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring__track { stroke: rgba(215, 221, 213, .8); }
.ring__bar { stroke: url(#ringGrad); transition: stroke-dashoffset 900ms var(--ease-out); }
.ring__label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring__label b { display: block; font: 400 24px/1 var(--serif); color: var(--forest); }
.ring__label span { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.hud__mode { display: flex; flex-direction: column; gap: 6px; }
.hud__mode b { font: 400 18px/1.2 var(--serif); color: var(--forest); }
.hud__mode span { font-size: 12.5px; color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.stat { padding: 12px 14px; border-radius: var(--r-md); background: rgba(247, 248, 245, .85); border: 1px solid var(--line); min-width: 0; }
.stat__label { display: flex; align-items: center; gap: 6px; font: 600 10.5px/1.1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat__label .icon { width: 13px; height: 13px; color: var(--green); }
.stat__value { margin-top: 7px; font: 400 21px/1 var(--serif); color: var(--forest); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 4px; }
.stat__value small { font: 500 12px/1 var(--sans); color: var(--muted); }
.stat__value.is-bump { animation: bump 600ms var(--ease-spring); }
.stat__value.is-locked { color: var(--stone); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--green); } 100% { transform: scale(1); } }
.stat--flame .stat__label .icon { color: var(--gold-ink); }
.hud__locked { margin-top: 12px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }

.mini-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.hud__actions { display: flex; gap: 8px; }
.hud__actions .btn { flex: 1; }

.mstrip { display: none; }

/* ── 12 · Navigator ──────────────────────────────────────────────────────── */
.nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.nav-cell { position: relative; aspect-ratio: 1; min-height: 40px; border-radius: 12px; display: grid; place-items: center; font: 600 13.5px/1 var(--sans); font-variant-numeric: tabular-nums;
  color: var(--muted); background: rgba(247, 248, 245, .9); border: 1px solid var(--stone);
  transition: transform var(--t-med) var(--ease-out), background var(--t-med), border-color var(--t-med), color var(--t-med), box-shadow var(--t-med); }
.nav-cell:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--sh-1); }
.nav-cell[data-state="answered"] { background: #E4ECE6; color: var(--dark); border-color: var(--accent); }
.nav-cell[data-state="correct"] { background: var(--green); color: var(--cloud); border-color: var(--green); }
.nav-cell[data-state="wrong"] { background: var(--rose-soft); color: var(--rose); border-color: var(--rose-line); }
.nav-cell[data-state="skipped"] { border-style: dashed; }
.nav-cell.is-current { box-shadow: 0 0 0 2px var(--cloud), 0 0 0 4px var(--forest); color: var(--forest); }
.nav-cell.is-current[data-state="correct"] { color: var(--cloud); }
.nav-cell .flag { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--cloud); }
.nav-cell .flag--bm { background: var(--gold); }
.nav-cell .flag--rv { background: var(--dark); right: auto; left: -3px; }
.mini-nav { gap: 6px; }
.mini-nav .nav-cell { aspect-ratio: auto; height: 36px; min-height: 0; border-radius: 10px; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--stone); background: var(--paper); }
.legend i.l-ans { background: #E4ECE6; border-color: var(--accent); }
.legend i.l-ok { background: var(--green); border-color: var(--green); }
.legend i.l-bad { background: var(--rose-soft); border-color: var(--rose-line); }
.legend i.l-bm { border-radius: 50%; background: var(--gold); border-color: var(--gold); }
.legend i.l-rv { border-radius: 50%; background: var(--dark); border-color: var(--dark); }
.jump { display: flex; gap: 8px; margin-top: 18px; }
.jump input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--stone); background: var(--cloud); transition: border-color var(--t-fast), box-shadow var(--t-med); }
.jump input:focus { border-color: var(--green); box-shadow: var(--glow); }
.sheet-stats .stats { margin-top: 0; }
.sheet > .muted { margin-bottom: 22px; }

/* ── 13 · Dialogs & sheets ───────────────────────────────────────────────── */
.dialog-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; }
.dialog-backdrop { position: absolute; inset: 0; background: rgba(39, 49, 46, .28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade-in 380ms var(--ease-out) both; }
.dialog { position: relative; width: min(520px, 100%); max-height: min(86dvh, 900px); overflow: auto; overscroll-behavior: contain; padding: clamp(22px, 3vw, 32px);
  background: var(--glass-strong); border-radius: var(--r-xl); border: 1px solid rgba(255, 255, 255, .8); box-shadow: var(--sh-3);
  animation: dialog-in 560ms var(--ease-out) both; }
.dialog--wide { width: min(1040px, 100%); }
.dialog-layer.is-closing .dialog-backdrop { animation: fade-out 280ms var(--ease-in-out) both; }
.dialog-layer.is-closing .dialog { animation: dialog-out 280ms var(--ease-in-out) both; }
@keyframes fade-in { from { opacity: 0; } } @keyframes fade-out { to { opacity: 0; } }
@keyframes dialog-in { from { opacity: 0; transform: translate3d(0, 16px, 0) scale(.97); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes dialog-out { to { opacity: 0; transform: translate3d(0, 10px, 0) scale(.98); } }
.dialog__close { position: absolute; top: 14px; right: 14px; }
.dialog__icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--mint); color: var(--dark); margin-bottom: 18px; }
.dialog__icon--gold { background: var(--gold-soft); color: var(--gold-ink); }
.dialog h2 { font-size: 26px; padding-right: 40px; }
.dialog__text { margin-top: 10px; color: var(--muted); line-height: 1.65; }
.dialog__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 26px; }
.summary-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; }
.summary-list li { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: var(--r-sm); background: rgba(247, 248, 245, .95); border: 1px solid var(--line); font-size: 14.5px; }
.summary-list b { font: 400 19px/1 var(--serif); color: var(--forest); }

/* Side drawer (desktop) → bottom sheet (mobile) */
.dialog-layer--sheet { place-items: stretch end; padding: 0; }
.sheet { position: relative; width: min(420px, 100%); height: 100%; overflow: auto; padding: calc(24px + var(--safe-t)) 26px calc(26px + var(--safe-b));
  background: var(--glass-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--sh-3); border-left: 1px solid rgba(255, 255, 255, .8);
  animation: drawer-in 560ms var(--ease-out) both; }
.dialog-layer--sheet.is-closing .sheet { animation: drawer-out 300ms var(--ease-in-out) both; }
@keyframes drawer-in { from { transform: translate3d(100%, 0, 0); } }
@keyframes drawer-out { to { transform: translate3d(100%, 0, 0); } }
.sheet__handle { display: none; }
.sheet h2 { font-size: 24px; margin-bottom: 6px; }
.sheet__section + .sheet__section { margin-top: 26px; }
.sheet__section > .eyebrow { display: block; margin-bottom: 12px; }

.shortcuts { display: grid; gap: 8px; margin-top: 20px; }
.shortcut { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 14px; border-radius: var(--r-sm); background: rgba(247, 248, 245, .95); border: 1px solid var(--line); font-size: 14.5px; }
.shortcut span:last-child { display: flex; gap: 5px; }

/* ── 14 · Toasts ─────────────────────────────────────────────────────────── */
.toast-root { position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: var(--r-pill); background: rgba(48, 70, 62, .94); color: var(--cloud); font-size: 14px; box-shadow: var(--sh-3);
  backdrop-filter: blur(10px); animation: toast-in 520ms var(--ease-spring) both; max-width: min(92vw, 520px); }
.toast .icon { color: var(--gold); }
.toast.is-out { animation: toast-out 320ms var(--ease-in-out) both; }
@keyframes toast-in { from { opacity: 0; transform: translate3d(0, 16px, 0) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translate3d(0, 8px, 0) scale(.98); } }

/* ── 15 · Results dashboard ──────────────────────────────────────────────── */
.results { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.results > * { animation: rise 820ms var(--ease-out) both; }

.results > *:nth-child(4) { animation-delay: 200ms; } .results > *:nth-child(5) { animation-delay: 260ms; }
.results > *:nth-child(6) { animation-delay: 320ms; } .results > *:nth-child(7) { animation-delay: 380ms; }
.results > *:nth-child(n+8) { animation-delay: 440ms; }
.span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; }

.r-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: clamp(22px, 4vw, 48px); align-items: center; padding: clamp(24px, 4vw, 44px); overflow: hidden; }
.r-hero::before { content: ""; position: absolute; right: -80px; bottom: -120px; width: 420px; height: 300px; opacity: .5; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(214, 184, 110, .25), transparent 65%); }
.score-ring { position: relative; width: clamp(170px, 18vw, 220px); aspect-ratio: 1; }
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-ring__bar { transition: stroke-dashoffset 2000ms var(--ease-out); }
.score-ring__label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.score-ring__label b { font: 400 clamp(44px, 5vw, 58px)/1 var(--serif); color: var(--forest); letter-spacing: -.03em; }
.score-ring__label b small { font-size: .45em; color: var(--muted); margin-left: 2px; }
.score-ring__label > span { margin-top: 6px; font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
.r-hero__text h1 { font-size: clamp(30px, 3.6vw, 44px); margin: 10px 0 12px; }
.r-hero__text p { color: var(--muted); max-width: 36em; line-height: 1.7; }
.r-hero__text .meta-chips { margin-top: 18px; }
.grade { position: relative; width: 116px; text-align: center; }
.grade__seal { width: 116px; height: 116px; border-radius: 26px; display: grid; place-items: center; background: linear-gradient(160deg, #3A554B, var(--forest)); color: var(--gold); box-shadow: var(--sh-2), inset 0 0 0 4px rgba(214, 184, 110, .35), inset 0 0 0 5px rgba(48, 70, 62, 1), inset 0 0 0 6px rgba(214, 184, 110, .5);
  font: 400 62px/1 var(--serif); animation: seal-in 900ms var(--ease-spring) 900ms both; }
@keyframes seal-in { from { opacity: 0; transform: scale(1.4) rotate(-8deg); } to { opacity: 1; transform: rotate(-3deg); } }
.grade span { display: block; margin-top: 14px; font: 600 11px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.tile { padding: 18px 20px; }
.tile__label { display: flex; align-items: center; gap: 8px; font: 600 11px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile__label .icon { width: 16px; height: 16px; color: var(--green); }
.tile__value { margin-top: 12px; font: 400 34px/1 var(--serif); color: var(--forest); font-variant-numeric: tabular-nums; }
.tile__value small { font: 500 14px/1 var(--sans); color: var(--muted); margin-left: 4px; }

.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 6px 14px; align-items: center; }
.bar-row__label { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row__label small { color: var(--muted); margin-left: 6px; }
.bar-row__value { grid-row: span 2; text-align: right; font: 400 19px/1 var(--serif); color: var(--forest); font-variant-numeric: tabular-nums; }
.bar-track { height: 9px; border-radius: 99px; background: rgba(215, 221, 213, .7); overflow: hidden; }
.bar-fill { height: 100%; border-radius: inherit; width: 100%; transform-origin: left; transform: scaleX(0); transition: transform 1400ms var(--ease-out);
  background: linear-gradient(90deg, var(--accent), var(--green)); }
.bar-fill[data-tone="low"] { background: linear-gradient(90deg, #E3B7AE, var(--rose)); }
.bar-fill[data-tone="mid"] { background: linear-gradient(90deg, #E8D49C, var(--gold)); }
.is-drawn .bar-fill { transform: scaleX(var(--v)); }

.diff-chart { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: end; height: 220px; padding-top: 10px; }
.diff-col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 10px; }
.diff-col__track { position: relative; width: 100%; max-width: 64px; flex: 1; border-radius: 14px; background: rgba(215, 221, 213, .55); overflow: hidden; }
.diff-col__fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; transform-origin: bottom; transform: scaleY(0); transition: transform 1400ms var(--ease-out); border-radius: 14px; background: linear-gradient(0deg, var(--green), var(--accent)); }
.diff-col:nth-child(3) .diff-col__fill { background: linear-gradient(0deg, #C4A353, var(--gold)); }
.diff-col:nth-child(4) .diff-col__fill { background: linear-gradient(0deg, var(--forest), var(--dark)); }
.is-drawn .diff-col__fill { transform: scaleY(var(--v)); }
.diff-col__pct { font: 400 17px/1 var(--serif); color: var(--forest); }
.diff-col__label { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.3; }
.diff-col__label b { display: block; color: var(--text); font-weight: 600; }

.timeline { width: 100%; height: auto; overflow: visible; }
.timeline .grid-line { stroke: var(--line); stroke-dasharray: 2 4; }
.timeline .axis-label { font: 500 11px var(--sans); fill: var(--muted); }
.timeline .acc-line { fill: none; stroke: var(--dark); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset 2200ms var(--ease-out); }
.timeline .acc-area { fill: url(#areaGrad); opacity: 0; transition: opacity 1200ms var(--ease-out) 800ms; }
.is-drawn .timeline .acc-line { stroke-dashoffset: 0; }
.is-drawn .timeline .acc-area { opacity: 1; }
.timeline .pt { cursor: pointer; transition: transform var(--t-med) var(--ease-spring); transform-box: fill-box; transform-origin: center; }
.timeline .pt:hover, .timeline .pt:focus-visible { transform: scale(1.35); }
.timeline .pt circle { stroke: var(--cloud); stroke-width: 2.5; }
.timeline .pt[data-o="correct"] circle { fill: var(--green); }
.timeline .pt[data-o="wrong"] circle { fill: var(--rose); }
.timeline .pt[data-o="skipped"] circle { fill: var(--stone); }
.timeline .streak-band { fill: rgba(214, 184, 110, .16); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 50%; }

.sw { display: grid; gap: 12px; }
.sw__item { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-md); background: rgba(247, 248, 245, .9); border: 1px solid var(--line); }
.sw__icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--mint); color: var(--dark); }
.sw__item--weak .sw__icon { background: var(--rose-soft); color: var(--rose); }
.sw__item b { display: block; font: 400 16px/1.3 var(--serif); color: var(--forest); }
.sw__item span { font-size: 12.5px; color: var(--muted); }
.sw__pct { font: 400 22px/1 var(--serif); color: var(--forest); }

.gauge { display: flex; flex-direction: column; align-items: center; text-align: center; }
.gauge > svg { width: min(280px, 100%); height: auto; overflow: visible; }
.gauge__arc { transition: stroke-dashoffset 2000ms var(--ease-out); }
.gauge__needle { transition: transform 2000ms var(--ease-out); transform-origin: 140px 140px; }
.gauge b { display: block; margin-top: -30px; font: 400 40px/1 var(--serif); color: var(--forest); }
.gauge__level { margin-top: 10px; font: 400 19px/1.2 var(--serif); color: var(--dark); }
.gauge p { margin-top: 8px; font-size: 13.5px; color: var(--muted); line-height: 1.6; max-width: 30em; }

.recs { display: grid; gap: 12px; counter-reset: rec; }
.rec { display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 16px 18px; border-radius: var(--r-md); background: rgba(247, 248, 245, .9); border: 1px solid var(--line); }
.rec::before { counter-increment: rec; content: counter(rec, decimal-leading-zero); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 400 14px/1 var(--serif); color: var(--gold-ink); background: var(--gold-soft); }
.rec b { display: block; font: 400 16.5px/1.35 var(--serif); color: var(--forest); margin-bottom: 4px; }
.rec p { font-size: 14px; line-height: 1.65; color: var(--muted); }
.rec .concepts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rec .concepts span { font-size: 12px; padding: 5px 10px; border-radius: var(--r-pill); background: var(--cloud); border: 1px solid var(--line); color: var(--dark); }

.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ach { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 18px 12px; border-radius: var(--r-lg); background: rgba(247, 248, 245, .9); border: 1px solid var(--line);
  transition: transform var(--t-med) var(--ease-out), box-shadow var(--t-med) var(--ease-out); }
.ach:hover { transform: translateY(-3px); box-shadow: var(--sh-2); }
.ach__medal { width: 64px; height: 64px; }

.ach span { font-size: 12px; line-height: 1.45; color: var(--muted); }

.ach.is-locked .ach__medal { filter: grayscale(1); opacity: .6; }
.ach.is-earned .ach__medal { animation: medal 900ms var(--ease-spring) both; animation-delay: calc(var(--i) * 90ms + 600ms); }
@keyframes medal { from { transform: scale(.4) rotate(-20deg); opacity: 0; } }

.review-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.filter { height: 36px; padding: 0 14px; border-radius: var(--r-pill); font: 600 13px/1 var(--sans); color: var(--muted); border: 1px solid var(--line); background: rgba(251, 251, 248, .7); transition: all var(--t-fast); display: inline-flex; gap: 8px; align-items: center; }
.filter b { font-weight: 600; font-size: 11.5px; color: inherit; opacity: .7; }
.filter:hover { border-color: var(--accent); color: var(--dark); }
.filter[aria-pressed="true"] { background: var(--forest); color: var(--cloud); border-color: var(--forest); }
.review-item .accordion__btn { font-size: 15.5px; align-items: flex-start; }
.review-item__num { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font: 600 12px/1 var(--sans); background: var(--mint); color: var(--dark); }
.review-item[data-o="wrong"] .review-item__num { background: var(--rose-soft); color: var(--rose); }
.review-item[data-o="skipped"] .review-item__num { background: var(--stone); color: var(--muted); }
.review-item__q { flex: 1; min-width: 0; line-height: 1.45; padding-top: 4px; }
.review-item__answers { display: grid; gap: 8px; margin-bottom: 6px; font-size: 14px; }
.review-item__answers div { display: flex; gap: 10px; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(247, 248, 245, .95); }

.review-item__answers .bad { background: var(--rose-soft); }

.r-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 26px; }

/* ── 16 · Charts (shared) ────────────────────────────────────────────────── */
.chart-card { min-height: 100%; }

/* ── 17 · Certificate ────────────────────────────────────────────────────── */
.cert-wrap { display: grid; place-items: center; }
.cert-wrap .cert { max-width: calc((100dvh - 330px) * 1.414); margin: 0 auto; }
.cert-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin-bottom: 18px; padding-right: 48px; }
.cert-head .field { flex: 0 1 360px; }
.cert-head .field input { height: 52px; }
.cert-scale { width: 100%; }
.cert { position: relative; width: 100%; aspect-ratio: 297 / 210; container-type: inline-size; background: #FBFAF4; color: var(--text); overflow: hidden;
  border-radius: 6px; box-shadow: 0 30px 60px -30px rgba(48, 70, 62, .45), 0 0 0 1px rgba(48, 70, 62, .08); animation: cert-reveal 1100ms var(--ease-out) both; }
@keyframes cert-reveal { from { opacity: 0; transform: translate3d(0, 24px, 0) rotateX(8deg) scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.cert__art { position: absolute; inset: 0; width: 100%; height: 100%; }
.cert__content { position: absolute; inset: 11% 14% 10%; display: flex; flex-direction: column; align-items: center; text-align: center; }
.cert__kicker { font: 600 1.05cqw/1 var(--sans); letter-spacing: .5em; text-transform: uppercase; color: var(--gold-ink); margin-top: 8.4cqw; }

.cert__stats { display: flex; gap: 4.5cqw; margin-top: 2cqw; }

.cert__foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; }
.cert__sig { text-align: left; min-width: 22cqw; }
.cert__sig div { font: italic 400 1.7cqw/1 var(--serif); color: var(--dark); padding-bottom: .8cqw; border-bottom: 1px solid rgba(48, 70, 62, .35); }

.cert__date div { font: 400 1.6cqw/1 var(--serif); color: var(--forest); padding-bottom: .8cqw; border-bottom: 1px solid rgba(48, 70, 62, .35); }
.cert__stamp { position: absolute; left: 30%; bottom: 8.5%; width: 9cqw; height: 9cqw; transform: rotate(-8deg); opacity: .92; animation: stamp 700ms var(--ease-spring) 1000ms both; }
@keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-20deg); } to { opacity: .92; transform: scale(1) rotate(-8deg); } }
.cert__no { position: absolute; left: 50%; bottom: 4.4%; transform: translateX(-50%); font: 500 .8cqw/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
.cert-name-field { margin-bottom: 18px; }
.print-root { display: none; }

/* ── 18 · Splash & loader ────────────────────────────────────────────────── */
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); transition: opacity 700ms var(--ease-out), visibility 700ms; }

    background: rgba(251, 251, 248, .9); backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1); box-shadow: var(--sh-3); }

/* ── 20 · Reduced motion ─────────────────────────────────────────────────── */

}

/* ── 21 · Print ──────────────────────────────────────────────────────────── */

  .card { background: #fff !important; box-shadow: none !important; border: 1px solid #DDE3DC !important; backdrop-filter: none !important; break-inside: avoid; }
  .results > * { animation: none !important; }

  body.print-cert .print-root { display: block !important; }
  body.print-cert { margin: 0; }
}
@media print { body.print-cert { } }

/* ── Revisit states: no replayed animations when returning to a question ─── */

      [`Сбалансированность и синхронность`, `Притоки и оттоки должны совпадать по объёму и во времени — иначе возникают кассовые разрывы.`],
      [`Операционный и финансовый цикл`, `ОЦ = оборот запасов + оборот дебиторки; ФЦ = ОЦ − оборот кредиторки — время, на которое «заморожены» деньги.`],
      [`Модели управления остатком`, `Баумоля — для равномерных расходов; Миллера–Орра — для случайных колебаний с коридором и точкой возврата.`],
      [`Свободный денежный поток`, `Операционный поток минус капитальные вложения — деньги, доступные собственникам и кредиторам.`]

    formulas: [
      [`Косвенный метод`, `ОДП = ЧП + Амортизация − ΔДЗ − ΔЗапасов + ΔКЗ ± прочие корректировки`, `Рост активов — минус, рост пассивов — плюс.`],
      [`Коэффициент ликвидности потока`, `Kл = ПДП / ОДП`, `ПДП — положительный, ОДП — отрицательный поток. Ориентир ≥ 1.`],
      [`Финансовый цикл`, `ФЦ = Оборот запасов + Оборот ДЗ − Оборот КЗ`, ``],
      [`Модель Баумоля`, `Q* = √(2 · F · T / r)`, `F — расходы на операцию, T — годовая потребность, r — доходность ценных бумаг. Средний остаток Q*/2.`],
      [`Миллер–Орр`, `S = 3 · ∛(3Fσ² / 4r);  H = L + S;  Z = L + S / 3`, `L — нижняя граница, Z — точка возврата.`],
      [`Свободный поток и NPV`, `FCF = ОДП − CAPEX;  NPV = Σ CFₜ / (1 + r)ᵗ − I₀`, ``]

    example: { title: `Косвенный метод`, steps: [

    pitfalls: [`Отождествлять прибыль и деньги.`, `Путать знак изменения кредиторской задолженности.`, `Оценивать только итоговый поток без структуры по видам деятельности.`],
    summary: `Компании становятся неплатёжеспособными не из-за убытков, а из-за отсутствия денег.`
  },
  en: {
    title: `Cash flow analysis`,
    lead: `How cash flow differs from profit, how flows are classified and calculated by the direct and indirect methods, assessed with ratios, and how the cash balance is managed.`,
    tip: `Practise the indirect method, the cash conversion cycle and the Baumol model — they are the core of the practical class.`,
    concepts: [
      [`Cash flow`, `The movement of cash over a period: receipts (inflow) and payments (outflow). Net cash flow is the difference.`],
      [`Profit vs cash`, `Profit is measured on an accrual basis, cash flow on a cash basis. Growing receivables and inventory, capital spending and debt repayment open a gap between them.`],
      [`Activities`, `Operating (customers, suppliers, staff, taxes), investing (non-current assets, long-term investments), financing (loans, share issues, dividends).`],
      [`Direct method`, `Shows gross receipts and payments by line — useful for day-to-day management.`],
      [`Indirect method`, `Derives operating cash flow from net profit by adjusting for non-cash items and changes in working capital.`],
      [`Balance and synchronisation`, `Inflows and outflows must match in volume and in timing — otherwise cash gaps appear.`],
      [`Operating and cash cycles`, `OC = inventory days + receivable days; CCC = OC − payable days — how long cash is “frozen”.`],
      [`Cash balance models`, `Baumol for even spending; Miller–Orr for random fluctuations, with a corridor and a return point.`],
      [`Free cash flow`, `Operating cash flow minus capital expenditure — cash available to owners and lenders.`]
    ],
    formulas: [
      [`Indirect method`, `OCF = NP + Depreciation − ΔAR − ΔInventory + ΔAP ± other adjustments`, `Assets up — minus; liabilities up — plus.`],
      [`Cash flow liquidity ratio`, `Kl = Inflows / Outflows`, `Benchmark ≥ 1.`],
      [`Cash conversion cycle`, `CCC = Inventory days + Receivable days − Payable days`, ``],
      [`Baumol model`, `Q* = √(2 · F · T / r)`, `F — cost per transfer, T — annual need, r — securities yield. Average balance Q*/2.`],
      [`Miller–Orr`, `S = 3 · ∛(3Fσ² / 4r);  H = L + S;  Z = L + S / 3`, `L — lower limit, Z — return point.`],
      [`Free cash flow and NPV`, `FCF = OCF − CAPEX;  NPV = Σ CFₜ / (1 + r)ᵗ − I₀`, ``]
    ],
    example: { title: `Indirect method`, steps: [
      `Net profit 800, depreciation 200, increase in receivables 150, in inventory 50, in payables 100 (m soums).`,
      `OCF = 800 + 200 − 150 − 50 + 100 = 900 m soums.`,
      `The gap with profit (+100) is explained by depreciation and working-capital changes.`],
      result: `Profit is an opinion, cash is a fact: the indirect method shows how one becomes the other.` },
    pitfalls: [`Treating profit as cash.`, `Getting the sign of the change in payables wrong.`, `Judging only the bottom line without the activity structure.`],
    summary: `Companies fail not from losses but from running out of cash.`
  }

  en: {

      [`Постоянные и переменные затраты`, `Постоянные (аренда, оклады управленцев, амортизация) не зависят от объёма; переменные (сырьё, сдельная оплата) меняются пропорционально объёму.`],

  en: {

      [`Break-even in money`, `R* = FC / CMR;  CMR = CM / Revenue`, ``],

  en: {

    q: `Расположите этапы анализа денежных потоков предприятия в логической последовательности: (1) расчёт коэффициентов эффективности и достаточности; (2) анализ объёма и структуры потоков по видам деятельности; (3) разработка мер по оптимизации; (4) оценка сбалансированности и синхронности положительного и отрицательного потоков.`,

    ctx: { head: [`Показатель`, `Значение`], rows: [[`Годовая потребность в денежных средствах (T)`, `1 200 000 сум`], [`Расходы на одну операцию пополнения (F)`, `120 сум`], [`Доходность краткосрочных ценных бумаг (r)`, `8% годовых`]] },

    ex: `Q* = √(2·F·T / r) = √(2 · 120 · 1 200 000 / 0,08) = √3 600 000 000 = 60 000 сум Количество операций = T / Q* = 1 200 000 / 60 000 = 20. Средний остаток = Q* / 2 = 30 000 сум Модель балансирует две противоположные издержки: транзакционные (чем чаще пополняем, тем они выше) и упущенную выгоду (чем больше денег держим, тем больше теряем дохода). В оптимуме они равны: 20 · 120 = 2 400 сум и 30 000 · 0,08 = 2 400 сум`,

  en: {

    o: [`UZS 42,426; about 28 transfers`, `UZS 30,000; 40 transfers`, `UZS 60,000; 20 transfers`, `UZS 120,000; 10 transfers`],

{
  id: `q15`, topic: `models`, module: `cashflow`, diff: `hard`, time: 105, type: `scenario`, correct: 3,
  ru: {
    q: `Компания управляет остатком денежных средств по модели Миллера–Орра. Остаток достиг верхней границы коридора. Что должен сделать финансовый менеджер?`,
    o: [`Перевести в ценные бумаги весь остаток сверх нижней границы, чтобы максимизировать доход`,
        `Ничего не делать: модель требует действий только при достижении нижней границы`,

    ex: `Модель Миллера–Орра предназначена для непредсказуемых, случайно колеблющихся потоков. Задаются нижняя граница L (страховой запас) и ширина коридора S = 3 · ∛(3Fσ² / 4r). Верхняя граница H = L + S, точка возврата Z = L + S / 3. Пока остаток внутри коридора, ничего не делают. На верхней границе покупают ценные бумаги на сумму H − Z, на нижней — продают их на сумму Z − L. Точка возврата смещена к нижней границе, потому что хранить деньги дорого: это упущенная доходность.`,

    takeaway: `Модель Миллера–Орра управляет случайными потоками через коридор и точку возврата; чем выше волатильность потоков (σ), тем шире коридор.`

  en: {
    q: `A company manages its cash balance with the Miller–Orr model. The balance has reached the upper limit of the corridor. What should the financial manager do?`,
    o: [`Move everything above the lower limit into securities to maximise income`,
        `Do nothing: the model calls for action only at the lower limit`,
        `Buy securities in an amount that returns the balance exactly to the middle of the corridor`,
        `Buy securities in an amount that returns the balance to the return point, one third of the corridor above the lower limit`],
    ex: `The Miller–Orr model is designed for unpredictable, randomly fluctuating flows. A lower limit L (safety stock) and a spread S = 3 · ∛(3Fσ² / 4r) are set. The upper limit is H = L + S, the return point Z = L + S / 3. While the balance stays inside the corridor, nothing is done. At the upper limit, securities worth H − Z are bought; at the lower limit, securities worth Z − L are sold. The return point sits closer to the floor because holding cash is costly — it means lost yield.`,

    example: `The treasury of a distributor with unpredictable receipts from hundreds of clients steps in only when the balance leaves the corridor.`,
    related: `Baumol model; Stone model.`,
    takeaway: `Miller–Orr manages random flows with a corridor and a return point; the higher the volatility (σ), the wider the corridor.`
  }
},

  en: {

{
  id: `q18`, topic: `value`, module: `cashflow`, diff: `hard`, time: 120, type: `calc`, correct: 2,
  ru: {
    q: `Рассчитайте чистую приведённую стоимость (NPV) инвестиционного проекта.`,
    ctx: { head: [`Показатель`, `Значение`], rows: [[`Инвестиции сегодня`, `1 000 тыс. сум`], [`Поступление в конце 1-го года`, `600 тыс. сум`], [`Поступление в конце 2-го года`, `600 тыс. сум`], [`Ставка дисконтирования`, `10% годовых`]] },
    o: [`200,0 тыс. сум`, `45,5 тыс. сум`, `41,3 тыс. сум`, `−8,3 тыс. сум`],
    ex: `PV₁ = 600 / 1,1 = 545,45; PV₂ = 600 / 1,1² = 600 / 1,21 = 495,87. Сумма = 1 041,32; NPV = 1 041,32 − 1 000 = 41,32 тыс. сум > 0 — проект увеличивает ценность компании. Деньги имеют временную стоимость: сум сегодня дороже сума через год, потому что его можно инвестировать.`,
    why: [`Потоки просто сложены без дисконтирования — временная стоимость денег проигнорирована.`,
          `Второй поток разделён на 1,2 (простой процент) вместо 1,21 (сложный процент).`,
          `Верно: 545,45 + 495,87 − 1 000 = 41,32.`,
          `Оба потока продисконтированы по множителю второго года (1,21); каждый поток дисконтируется на свой срок.`],
    trick: `«Каждый поток — в свою степень: год n → (1 + r)ⁿ».`,
    mistake: `Делить поток второго года на (1 + 2r) вместо (1 + r)².`,
    example: `Компания решает, покупать ли оборудование, которое даст экономию 600 тыс. сум в год в течение двух лет.`,
    related: `Дисконтирование; внутренняя норма доходности (IRR); дисконтированный срок окупаемости.`,
    takeaway: `Сравнивать денежные потоки разных периодов можно, только приведя их к одному моменту времени.`

  en: {

},

    ex: `Отрицательный свободный поток бывает двух принципиально разных типов. Первый — слабая основная деятельность (операционный поток около нуля или отрицателен): это тревожно. Второй — активные инвестиции при здоровом операционном потоке: это нормально для растущей компании. Здесь операционный поток положителен, выручка растёт на 35%, а проекты обещают 18% при стоимости капитала 11%, то есть имеют положительную NPV. Однако аналитик обязан проверить долговую нагрузку: если рост замедлится, а проекты не дадут отдачи, долг станет проблемой. Полезно также разделять капитальные вложения на поддерживающие и развивающие.`,

  en: {
    q: `An investor sees negative free cash flow and concludes the company is “burning cash” and should be avoided. Which assessment of this conclusion is best supported?`,
    ctx: { head: [`Item for the year`, `Value`], rows: [[`Revenue growth`, `+35%`], [`Operating cash flow`, `+UZS 1,200 million`], [`Capital expenditure`, `−UZS 2,000 million`], [`Free cash flow`, `−UZS 800 million`], [`New borrowing`, `+UZS 900 million`], [`Expected project return / cost of capital`, `18% / 11%`]] },
    o: [`The conclusion is right: negative free cash flow always means the business is destroying value`,
        `The conclusion is right: the company borrowed, so it cannot survive on its own funds`,
        `The conclusion is wrong: free cash flow does not matter for growth valuation — only revenue growth does`,
        `The conclusion is premature: FCF is negative because of investment while operating cash flow is positive; if project returns exceed the cost of capital, the spending creates value, and the main risk is servicing the new debt`],
